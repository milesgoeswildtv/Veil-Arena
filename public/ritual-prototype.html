<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VEIL: RITUAL — Prototype</title>
<style>
:root{--bg:#070609;--panel:#17131b;--line:#3b3142;--text:#f4eff6;--muted:#9d92a3;--ok:#6aa486;--warn:#d0a15a;--bad:#d05367;--purple:#8d62b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050507;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;color:inherit}
#app{height:100%;position:relative;background:radial-gradient(circle at 50% 52%,rgba(105,59,126,.2),transparent 28%),linear-gradient(#08070a,#0b090d 55%,#050506)}
.hud{position:absolute;z-index:30;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;pointer-events:none}
.h{background:rgba(10,8,12,.78);border:1px solid rgba(180,145,198,.18);backdrop-filter:blur(10px);border-radius:12px;padding:8px 9px}.h.c{text-align:center}.h.r{text-align:right}.k{font-size:8px;letter-spacing:.17em;font-weight:900;color:#9d8ea5}.v{font-size:13px;font-weight:950;margin-top:2px}.bar{height:5px;width:102px;border-radius:99px;background:#28212d;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;width:84%;background:#9b76b4}
.view{position:absolute;inset:0;perspective:930px;touch-action:none;cursor:grab}.view.drag{cursor:grabbing}.ring{position:absolute;left:50%;top:51%;width:274px;height:475px;transform-style:preserve-3d;transform:translate(-50%,-50%);transition:transform .25s ease-out}.ring.free{transition:none}
.bay{position:absolute;inset:0;border-radius:27px;border:1px solid rgba(199,169,214,.14);background:linear-gradient(180deg,#211b25,#121015 57%,#09080b);box-shadow:inset 0 0 60px rgba(117,73,137,.1),0 25px 65px #0008;backface-visibility:hidden;overflow:hidden}
.bay:before{content:"";position:absolute;left:20px;right:20px;top:24px;height:172px;border:1px solid rgba(184,148,199,.12);border-radius:90px 90px 15px 15px}.baylabel{position:absolute;top:9px;left:13px;font-size:8px;color:#746b79;font-weight:900;letter-spacing:.16em}
.station{position:absolute;border:1px solid var(--line);background:linear-gradient(#1d1921,#111014);border-radius:17px;text-align:left;padding:10px;overflow:hidden;box-shadow:0 8px 28px #0007}.station.outer{top:72px;left:28px;right:28px;height:159px}.station.inner{bottom:34px;left:42px;right:42px;height:154px}.station.dormant{opacity:.27;pointer-events:none}.station.stable{border-color:#537962}.station.warning{border-color:#a97739;box-shadow:0 0 25px #b47f3522}.station.critical{border-color:#c84d61;box-shadow:0 0 28px #c84d6140;animation:blink 1s infinite}.station.corrupted{border-color:#8151a5;box-shadow:0 0 28px #8151a536}@keyframes blink{50%{box-shadow:0 0 40px #d4556b66}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-size:11px;font-weight:950;letter-spacing:.05em}.dot{width:8px;height:8px;border-radius:50%;background:#655e69}.stable .dot{background:var(--ok)}.warning .dot{background:var(--warn)}.critical .dot{background:var(--bad)}.corrupted .dot{background:#9a67c1}
.device{position:absolute;left:11px;right:11px;top:39px;bottom:10px;border:1px solid rgba(255,255,255,.05);border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,#37293e55,#0001)}.sym{font-size:44px}.occ{position:absolute;right:7px;bottom:7px;background:#0b090dcc;border:1px solid #473b4d;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.off{position:absolute;left:8px;bottom:7px;font-size:8px;letter-spacing:.12em;color:#827887;font-weight:900}
.seal{position:absolute;left:50%;bottom:6%;width:210px;height:78px;transform:translateX(-50%) perspective(350px) rotateX(63deg);border-radius:50%;border:2px solid #9d6db844;box-shadow:0 0 35px #8c5ba333,inset 0 0 25px #7f579522}.seal:before,.seal:after{content:"";position:absolute;border:1px solid #a77bbb33;border-radius:50%;inset:12px}.seal:after{inset:26px}
.edge{display:none;position:absolute;z-index:40;top:49%;transform:translateY(-50%);padding:9px 7px;border-radius:11px;background:#431522e6;border:1px solid #a73f55;color:#ffd9e1;font-size:9px;font-weight:950;max-width:90px}.edge.l{left:6px}.edge.r{right:6px;text-align:right}
.bottom{position:absolute;z-index:35;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.players{display:flex;flex-wrap:wrap;gap:4px;max-width:75%}.p{padding:5px 7px;border-radius:99px;border:1px solid #302936;background:#0c0a0ddd;font-size:8px;font-weight:850;color:#99909f}.p.you{color:#d4b9ea;border-color:#694b7e}.p.busy{color:#eee2f4;border-color:#51405b}.demo{pointer-events:auto;border:1px solid #4e4056;background:#211a26;border-radius:12px;padding:9px 11px;font-size:9px;font-weight:950;letter-spacing:.08em}
.angle{position:absolute;z-index:25;left:50%;bottom:71px;transform:translateX(-50%);padding:5px 8px;border-radius:99px;background:#080709aa;color:#766d7b;font-size:8px;font-weight:900;letter-spacing:.1em}
.panel{display:none;position:absolute;z-index:70;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));border:1px solid #4c4054;background:#151118;border-radius:17px;padding:13px;box-shadow:0 20px 70px #000}.panel.show{display:block}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.close{border:0;background:#29212e;border-radius:9px;padding:7px 9px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stages button,.chaos{border:1px solid #433748;background:#201a24;border-radius:10px;padding:9px 4px;font-size:8px;font-weight:950}.stages button.on{background:#664486}.chaos{width:100%;margin-top:8px}.chaos.on{background:#49202f;border-color:#8d3b51}
.overlay{display:none;position:absolute;z-index:100;inset:0;background:#060507f2;backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.card{width:min(100%,430px);border:1px solid #4a3d52;background:linear-gradient(#1d1921,#0f0d11);border-radius:23px;padding:17px}.cardhead{display:flex;justify-content:space-between;gap:10px}.title{font-size:22px;font-weight:950;margin-top:3px}.back{border:1px solid #403646;background:#221d27;border-radius:10px;padding:8px 10px;font-weight:900}.area{margin-top:16px;min-height:330px;border:1px solid #302936;border-radius:17px;background:radial-gradient(circle at 50% 35%,#281e30,#0e0c10 68%);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px}.hint{font-size:11px;color:#978d9d;text-align:center;line-height:1.4;margin-top:11px}.primary{border:1px solid #725492;background:#573a72;border-radius:13px;padding:13px 18px;font-weight:950;min-width:150px}
.candles{display:flex;gap:14px;align-items:end}.candle{width:42px;height:120px;border:0;background:none;position:relative}.wax{position:absolute;bottom:0;left:8px;right:8px;height:77px;background:#aca1a7;border-radius:7px}.flame{position:absolute;left:50%;bottom:71px;width:21px;height:33px;transform:translateX(-50%) rotate(45deg);border-radius:60% 10% 60% 60%;background:#d9aa63;box-shadow:0 0 18px #dfa95ccc}.candle.dead .flame{opacity:0}
.rings{position:relative;width:215px;height:215px}.rr{position:absolute;inset:0;border:3px solid #9c73b5;border-radius:50%;transition:transform .2s}.rr.two{inset:29px;border-style:dashed}.rr.three{inset:58px;border-color:#674f75}.rr button{position:absolute;inset:0;border:0;background:none}.rr span{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:21px}
.bell{font-size:96px;transform-origin:50% 0}.bell.hit{animation:ringbell .3s}@keyframes ringbell{30%{transform:rotate(12deg)}70%{transform:rotate(-10deg)}}.track{width:100%;height:10px;background:#28222e;border-radius:99px;position:relative;overflow:hidden;margin:18px 0}.zone{position:absolute;left:67%;width:15%;height:100%;background:#67976f99}.mark{position:absolute;left:0;width:8px;height:100%;background:#eee4f3}
.holdseal{width:215px;height:215px;border-radius:50%;border:3px solid #805793;display:grid;place-items:center;position:relative;box-shadow:0 0 35px #82569644,inset 0 0 30px #82569622}.holdseal:before,.holdseal:after{content:"";position:absolute;border:1px solid #735083;border-radius:50%;inset:24px}.holdseal:after{inset:52px}.progress{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#b187c055 var(--p,0%),transparent 0)}
.gmeter{width:100%;height:13px;border-radius:99px;background:#29222e;overflow:hidden;margin:18px 0}.gmeter span{display:block;height:100%;width:0;background:#8c68a0}.toast{position:absolute;z-index:150;left:50%;top:18%;transform:translate(-50%,-8px);opacity:0;background:#271b2b;border:1px solid #654c70;border-radius:11px;padding:8px 11px;font-size:9px;font-weight:950;white-space:nowrap;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
<div class="hud"><div class="h"><div class="k">VEIL: RITUAL</div><div class="v" id="stage">STAGE I</div></div><div class="h c"><div class="k">CONTAINMENT</div><div class="bar"><span id="fill"></span></div><div class="v" id="ct">84%</div></div><div class="h r"><div class="k">TIME</div><div class="v" id="time">08:00</div></div></div>
<div class="view" id="view"><div class="seal"></div><div class="ring" id="ring"></div></div>
<div class="edge l" id="left"></div><div class="edge r" id="right"></div><div class="angle" id="angle">BAY 1 • 0°</div>
<div class="bottom"><div class="players" id="players"></div><button class="demo" id="demo">DEMO</button></div>
<div class="panel" id="panel"><div class="panelhead"><div><div class="k">PROTOTYPE CONTROLS</div><b>Stage load test</b></div><button class="close" id="pclose">CLOSE</button></div><div class="stages"><button data-s="1" class="on">STAGE 1<br>8</button><button data-s="2">STAGE 2<br>10</button><button data-s="3">STAGE 3<br>12</button><button data-s="4">STAGE 4<br>14</button></div><button class="chaos" id="chaos">DEMO CHAOS: OFF</button></div>
<div class="overlay" id="overlay"><div class="card"><div class="cardhead"><div><div class="k" id="where">RITUAL STATION</div><div class="title" id="title"></div></div><button class="back" id="back">BACK</button></div><div class="area" id="area"></div><div class="hint" id="hint"></div></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
(function(){
const defs=[['The Bell','🔔','bell'],['Blood Measure','◉','generic'],['Mirror Array','◈','generic'],['Ritual Candles','🕯️','candles'],['Binding Chains','⛓','generic'],['Sigil Rings','✥','sigils'],['Pendulum','⌁','generic'],['Offering Scale','⚖','generic'],['Rune Wall','ᚱ','generic'],['Ash Circle','◌','generic'],['Resonance Forks','♆','generic'],['Black Thread','✣','generic'],['Prayer Wheels','⊛','generic'],['Relic Vessel','◇','generic'],['Incense Engine','≋','generic'],['Binding Seal','⨳','seal']];
const act=[[0,2,4,6,8,10,12,14],[0,2,4,6,8,10,12,14,3,11],[0,2,4,6,8,10,12,14,3,11,7,15],[0,2,4,6,8,10,12,14,3,11,7,15,5,9]];
const people=['YOU','KASS','LEDA','RUBY','CREK','MIKEY','ZERO','TIFF'];
let stations=defs.map((d,i)=>({id:i,name:d[0],sym:d[1],type:d[2],bay:Math.floor(i/2),slot:i%2?'inner':'outer',state:'dormant',occ:null}));
let angle=0,startX=null,startA=0,stage=1,contain=84,chaos=false,chaosInt=null,current=null,beatInt=null,holdReq=null;
const ring=document.getElementById('ring'),view=document.getElementById('view'),overlay=document.getElementById('overlay'),area=document.getElementById('area');
function radius(){return innerWidth>700?405:330}
function htmlStation(s){return '<div class="top"><div class="name">'+s.name.toUpperCase()+'</div><div class="dot"></div></div><div class="device"><div class="sym">'+s.sym+'</div></div>'+(s.occ?'<div class="occ">'+s.occ+'</div>':'')+(s.state==='dormant'?'<div class="off">DORMANT</div>':'')}
function build(){ring.innerHTML='';for(let b=0;b<8;b++){let bay=document.createElement('section');bay.className='bay';bay.style.transform='rotateY('+(b*45)+'deg) translateZ('+radius()+'px)';bay.innerHTML='<div class="baylabel">BAY '+(b+1)+' • '+(b*45)+'°</div>';stations.filter(x=>x.bay===b).forEach(s=>{let bt=document.createElement('button');bt.className='station '+s.slot+' '+s.state;bt.dataset.id=s.id;bt.innerHTML=htmlStation(s);bt.onclick=e=>{e.stopPropagation();open(s.id)};bay.appendChild(bt)});ring.appendChild(bay)}rotate(false);alerts()}
function refresh(s){let b=document.querySelector('.station[data-id="'+s.id+'"]');if(!b)return;b.className='station '+s.slot+' '+s.state;b.innerHTML=htmlStation(s)}
function setStage(n){stage=n;let set=new Set(act[n-1]);stations.forEach((s,i)=>{s.occ=null;if(!set.has(i))s.state='dormant';else if(s.state==='dormant')s.state='stable'});let ids=[...set];for(let i=0;i<Math.min(5,n+1);i++)stations[ids[(i*3+1)%ids.length]].occ=people[i+1];stations.forEach(refresh);document.getElementById('stage').textContent='STAGE '+['I','II','III','IV'][n-1];document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===n));roster();alerts();say('STAGE '+n+' • '+set.size+' ACTIVITIES ACTIVE')}
function roster(){let r=document.getElementById('players');r.innerHTML='';people.forEach((p,i)=>{let x=document.createElement('div');x.className='p'+(i===0?' you':'')+(stations.some(s=>s.occ===p)?' busy':'');x.textContent=p;r.appendChild(x)})}
function rotate(snap){ring.classList.toggle('free',!snap);ring.style.transform='translate(-50%,-50%) rotateY('+(-angle)+'deg)';let i=((Math.round(angle/45)%8)+8)%8;document.getElementById('angle').textContent='BAY '+(i+1)+' • '+(i*45)+'°';alerts()}
view.onpointerdown=e=>{startX=e.clientX;startA=angle;view.classList.add('drag');ring.classList.add('free');view.setPointerCapture&&view.setPointerCapture(e.pointerId)}
view.onpointermove=e=>{if(startX===null)return;angle=startA-(e.clientX-startX)*.18;rotate(false)}
function end(){if(startX===null)return;startX=null;view.classList.remove('drag');angle=Math.round(angle/45)*45;rotate(true)}view.onpointerup=end;view.onpointercancel=end;
function dir(t,c){let d=(t-c+8)%8;if(!d)return 0;return d<=4?1:-1}
function alerts(){let c=((Math.round(angle/45)%8)+8)%8;let crit=stations.filter(s=>s.state==='critical'&&s.bay!==c);let l=crit.find(s=>dir(s.bay,c)<0),r=crit.find(s=>dir(s.bay,c)>0),le=document.getElementById('left'),re=document.getElementById('right');le.style.display=l?'block':'none';re.style.display=r?'block':'none';if(l)le.textContent='⚠ ← '+l.name.toUpperCase();if(r)re.textContent=r.name.toUpperCase()+' → ⚠'}
function open(id){let s=stations[id];if(s.state==='dormant')return;current=s;overlay.classList.add('show');document.getElementById('title').textContent=s.name.toUpperCase();document.getElementById('where').textContent='BAY '+(s.bay+1)+' • '+s.slot.toUpperCase();if(s.type==='candles')candles();else if(s.type==='sigils')sigils();else if(s.type==='bell')bell();else if(s.type==='seal')sealGame();else generic()}
function close(){overlay.classList.remove('show');current=null;clearInterval(beatInt);beatInt=null;cancelAnimationFrame(holdReq)}document.getElementById('back').onclick=close;
function done(){if(!current)return;current.state='stable';refresh(current);contain=Math.min(100,contain+3);containment();say(current.name.toUpperCase()+' STABILIZED');setTimeout(close,350)}
function candles(){document.getElementById('hint').textContent='Relight every extinguished candle.';area.innerHTML='<div class="candles"></div>';let w=area.firstChild;[1,0,1,0].forEach(l=>{let b=document.createElement('button');b.className='candle '+(l?'':'dead');b.innerHTML='<span class="flame"></span><span class="wax"></span>';b.onclick=()=>{b.classList.remove('dead');if(!w.querySelector('.dead'))setTimeout(done,200)};w.appendChild(b)})}
function sigils(){document.getElementById('hint').textContent='Tap the concentric rings until all three marks point upward.';let val=[2,5,7];area.innerHTML='<div class="rings"><div class="rr"><span>✥</span><button data-r="0"></button></div><div class="rr two"><span>ᚱ</span><button data-r="1"></button></div><div class="rr three"><span>◇</span><button data-r="2"></button></div></div>';let rr=[...area.querySelectorAll('.rr')];function paint(){rr.forEach((x,i)=>x.style.transform='rotate('+(val[i]*45)+'deg)')}paint();area.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let i=+b.dataset.r;val[i]=(val[i]+1)%8;paint();if(val.every(v=>v===0))setTimeout(done,200)})}
function bell(){document.getElementById('hint').textContent='Strike while the marker is inside the timing window. Land 3.';area.innerHTML='<div class="bell" id="bl">🔔</div><div class="track"><div class="zone"></div><div class="mark" id="mk"></div></div><button class="primary" id="strike">STRIKE • 0/3</button>';let x=0,d=1,h=0,m=document.getElementById('mk'),bl=document.getElementById('bl'),bt=document.getElementById('strike');beatInt=setInterval(()=>{x+=d*2.5;if(x>=98||x<=0)d*=-1;m.style.left=x+'%'},20);bt.onclick=()=>{bl.classList.remove('hit');void bl.offsetWidth;bl.classList.add('hit');if(x>=67&&x<=82){h++;bt.textContent='STRIKE • '+h+'/3';if(h>=3){clearInterval(beatInt);setTimeout(done,180)}}else{contain=Math.max(0,contain-2);containment();say('MISSED STRIKE • -2 CONTAINMENT')}}}
function sealGame(){document.getElementById('hint').textContent='Press and hold until the seal stabilizes.';area.innerHTML='<div class="holdseal"><div class="progress" id="prog"></div><div style="font-size:54px;z-index:2">⨳</div></div><button class="primary" id="hold" style="margin-top:18px">HOLD SEAL</button>';let p=0,last=0,on=false,pr=document.getElementById('prog'),bt=document.getElementById('hold');function frame(t){if(!on)return;if(!last)last=t;p+=(t-last)/30;last=t;pr.style.setProperty('--p',Math.min(100,p)+'%');if(p>=100){on=false;done();return}holdReq=requestAnimationFrame(frame)}bt.onpointerdown=e=>{e.preventDefault();on=true;last=0;holdReq=requestAnimationFrame(frame)};function up(){on=false;cancelAnimationFrame(holdReq);last=0}bt.onpointerup=up;bt.onpointerleave=up;bt.onpointercancel=up}
function generic(){document.getElementById('hint').textContent='Prototype station. Stabilize the apparatus.';area.innerHTML='<div style="font-size:88px">'+current.sym+'</div><div class="gmeter"><span id="gm"></span></div><button class="primary" id="work">STABILIZE • 0%</button>';let p=0,b=document.getElementById('work'),m=document.getElementById('gm');b.onclick=()=>{p=Math.min(100,p+20);m.style.width=p+'%';b.textContent='STABILIZE • '+p+'%';if(p>=100)setTimeout(done,160)}}
function containment(){document.getElementById('fill').style.width=contain+'%';document.getElementById('ct').textContent=contain+'%'}
function tick(){if(!chaos)return;let a=stations.filter(s=>s.state!=='dormant'&&!s.occ);if(!a.length)return;let s=a[Math.floor(Math.random()*a.length)],r=Math.random();s.state=r<.2?'corrupted':r<.58?'warning':'critical';refresh(s);contain=Math.max(10,contain-(s.state==='critical'?5:2));containment();alerts();say(s.name.toUpperCase()+' '+s.state.toUpperCase())}
function say(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),1500)}
document.getElementById('demo').onclick=()=>document.getElementById('panel').classList.add('show');document.getElementById('pclose').onclick=()=>document.getElementById('panel').classList.remove('show');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));document.getElementById('chaos').onclick=e=>{chaos=!chaos;e.currentTarget.classList.toggle('on',chaos);e.currentTarget.textContent='DEMO CHAOS: '+(chaos?'ON':'OFF');clearInterval(chaosInt);if(chaos)chaosInt=setInterval(tick,4000)}
let seconds=480;setInterval(()=>{seconds=Math.max(0,seconds-1);document.getElementById('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);
build();setStage(1);containment();addEventListener('resize',build);
})();
</script>
</body>
</html>
