name = "veil-arena"
main = "src/worker.js"
compatibility_date = "2026-09-13"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "veil-arena"
database_id = "3474ca31-36e1-49c3-9901-57bb4eaf6f6c"

[[durable_objects.bindings]]
name = "ARENA_COORDINATOR"
class_name = "ArenaCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaCoordinator"]
