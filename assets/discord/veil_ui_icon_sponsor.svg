<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Sponsor</title>
  <desc>96x96 transparent Veil sponsor/funding/prize icon. Compact metallic token crest with a subtle wallet/transfer motif in silver/gunmetal with restrained violet energy accents. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_sponsor.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="violetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DEFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#C98CEB" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#7B4A9E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#593576" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sponsor token / backing crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Rear prize token for "funding / backed by" feel -->
  <circle cx="57" cy="37" r="14"
          fill="#0A0B0F"
          stroke="#40444D"
          stroke-width="1.4"/>

  <circle cx="57" cy="37" r="10.5"
          fill="url(#gunmetal)"
          stroke="url(#silver)"
          stroke-width="1.6"/>

  <circle cx="57" cy="37" r="6.4"
          fill="none"
          stroke="url(#violet)"
          stroke-opacity="0.52"
          stroke-width="1.2"/>

  <!-- Front sponsor medallion -->
  <circle cx="40" cy="50" r="18.5"
          fill="#090A0D"
          stroke="url(#silver)"
          stroke-width="2.0"/>

  <circle cx="40" cy="50" r="14.2"
          fill="url(#gunmetal)"
          stroke="#363941"
          stroke-width="1.2"/>

  <!-- Wallet / prize chest motif -->
  <path d="M29 46
           H47
           C49.2 46 51 47.8 51 50
           V57
           C51 59.2 49.2 61 47 61
           H29
           C26.8 61 25 59.2 25 57
           V50
           C25 47.8 26.8 46 29 46Z"
        fill="#0B0C10"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M31 42
           H45
           C47.2 42 49 43.8 49 46
           H35
           C32.8 46 31 44.2 31 42Z"
        fill="#12141A"
        stroke="#747982"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <circle cx="45.5" cy="53.5" r="2.1"
          fill="#090A0D"
          stroke="url(#violet)"
          stroke-width="1.0"/>

  <!-- Transfer / sponsor flow cue -->
  <path d="M45 33
           C52 31 58 33 62 38"
        stroke="url(#violet)"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <path d="M60 34L65 39L58 40"
        fill="none"
        stroke="url(#silver)"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M51 57
           C56 57 61 55 65 50"
        stroke="url(#violet)"
        stroke-width="1.45"
        stroke-linecap="round"/>

  <path d="M61 49L66 49L64 54"
        fill="none"
        stroke="url(#silver)"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Central sponsor energy point -->
  <circle cx="57" cy="37" r="3.9"
          fill="url(#violetCore)"
          filter="url(#coreGlow)"/>
  <circle cx="57" cy="37" r="1.45" fill="#F3E7FF"/>

  <!-- Supporting prize notches / subtle family details -->
  <path d="M32 66L37 71H43L48 66"
        fill="none"
        stroke="url(#silver)"
        stroke-width="1.35"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
