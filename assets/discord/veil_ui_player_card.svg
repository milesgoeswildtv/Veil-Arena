    <circle cx="126" cy="157" r="34" fill="none" stroke="url(#violetRail)" stroke-width="1.4" opacity="0.72"/>
    <circle cx="126" cy="142" r="17" fill="#0A0B10" stroke="url(#silver)" stroke-width="1.3"/>
    <path d="M96 196C101 176 113 167 126 167C139 167 151 176 156 196"
