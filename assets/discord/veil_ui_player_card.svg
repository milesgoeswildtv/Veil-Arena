<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none">
  <title>Veil UI Player Card</title>
  <desc>720x360 transparent responsive Veil player card shell for Arena lobbies, active matches, voting, spectating, and results. Includes a protected portrait zone on the left, a large live-text zone on the right, and a lower strip for actions or vote/sponsor information.</desc>

  <metadata>
    asset: veil_ui_player_card.svg
    family: veil_ui_panel_frame.svg
    canvas: 720x360
    aspect-ratio: 2:1
    transparent-background: true
    text: live HTML/CSS only
    intended-use: player shell for lobby, active game, voting, spectating, results
    portrait-zone: x=34..220, y=58..302
    text-zone: x=248..676, y=62..220
    lower-strip: x=248..676, y=238..302
    responsive: mobile + desktop
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.18" stop-color="#969AA3"/>
      <stop offset="0.52" stop-color="#D4D7DD"/>
      <stop offset="0.78" stop-color="#5A5E68"/>
      <stop offset="1" stop-color="#B1B5BE"/>
    </linearGradient>

    <linearGradient id="silverDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5C9D1"/>
      <stop offset="1" stop-color="#454A55"/>
    </linearGradient>

    <linearGradient id="gunmetalOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1F25"/>
      <stop offset="0.45" stop-color="#090A0E"/>
      <stop offset="1" stop-color="#15171D"/>
    </linearGradient>

    <linearGradient id="gunmetalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0D11"/>
      <stop offset="0.55" stop-color="#07080B"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>

    <linearGradient id="panelWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.52" stop-color="#05070A"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>

    <linearGradient id="violetRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E265C"/>
      <stop offset="0.20" stop-color="#7750A4"/>
      <stop offset="0.50" stop-color="#A771D3"/>
      <stop offset="0.80" stop-color="#7750A4"/>
      <stop offset="1" stop-color="#3E265C"/>
    </linearGradient>

    <radialGradient id="violetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2E3FF" stop-opacity="1"/>
      <stop offset="0.36" stop-color="#CA94EE" stop-opacity="0.92"/>
      <stop offset="0.70" stop-color="#7C4DA2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5A3676" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BA84E5" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#8A57B6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8A57B6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="edgeGlow" x="-20%" y="-120%" width="140%" height="340%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="microTexture" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="0.45" fill="#FFFFFF" opacity="0.024"/>
      <circle cx="15" cy="13" r="0.35" fill="#C38CEA" opacity="0.018"/>
      <path d="M7 17l4-1" stroke="#FFFFFF" stroke-width="0.3" opacity="0.014"/>
    </pattern>

    <clipPath id="avatarClip">
      <path d="M52 74H190L220 104V256L190 286H52L34 268V92Z"/>
    </clipPath>
  </defs>

  <!-- transparent exterior -->

  <!-- ambient corner glows -->
  <ellipse cx="82" cy="78" rx="36" ry="36" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <ellipse cx="638" cy="78" rx="36" ry="36" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <ellipse cx="82" cy="282" rx="36" ry="36" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <ellipse cx="638" cy="282" rx="36" ry="36" fill="url(#cornerGlow)" filter="url(#softGlow)"/>

