  <path d="M644 114V246" stroke="url(#violetRail)" stroke-width="1.6" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M88 122V238" stroke="#B680DB" stroke-opacity="0.10" stroke-width="0.8" stroke-linecap="round"/>
