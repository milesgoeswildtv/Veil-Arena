  <path d="M360 22V90" stroke="url(#violetRail)" stroke-width="2.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <circle cx="360" cy="70" r="8" fill="#0A0B0F" stroke="url(#silver)" stroke-width="1.2"/>
