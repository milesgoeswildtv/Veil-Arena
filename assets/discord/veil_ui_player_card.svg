    <path d="M59 59L38 47L47 68Z" fill="#0F1116" stroke="url(#silver)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M97 59L118 47L109 68Z" fill="#0F1116" stroke="url(#silver)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

