    <circle cx="642" cy="78" r="11.5" fill="#06070A" stroke="#695087" stroke-width="1.2"/>
    <circle cx="642" cy="78" r="4.5" fill="url(#violetCore)"/>
    <path d="M661 59L682 47L673 68Z" fill="#0F1116" stroke="url(#silver)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M623 59L602 47L611 68Z" fill="#0F1116" stroke="url(#silver)" stroke-width="1.4" stroke-linejoin="round"/>
