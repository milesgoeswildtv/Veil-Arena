  <!-- quiet content dividers -->
  <path d="M272 185H632" stroke="#A3A8B2" stroke-opacity="0.10" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M272 278H632" stroke="#A3A8B2" stroke-opacity="0.08" stroke-width="1.0" stroke-linecap="round"/>

  <!-- top and bottom rails -->
  <path d="M108 68H612" stroke="url(#violetRail)" stroke-width="1.8" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M108 292H612" stroke="url(#violetRail)" stroke-width="1.8" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M124 80H596" stroke="#B680DB" stroke-opacity="0.12" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M124 280H596" stroke="#B680DB" stroke-opacity="0.12" stroke-width="0.9" stroke-linecap="round"/>

