        stroke="#20242B"
        stroke-width="1.5"
        stroke-linejoin="round"/>
  <path d="M259 166H642L656 178V214L642 226H259L248 217V177Z"
        fill="#040509"/>
  <path d="M259 166H642L656 178V214L642 226H259L248 217V177Z"
        fill="url(#microTexture)" opacity="0.20"/>

  <!-- lower strip -->
  <path d="M248 246H654L672 262V292L654 308H248L236 298V256Z"
