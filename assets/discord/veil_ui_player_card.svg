  <path d="M337 334H383" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round" opacity="0.90"/>
  <path d="M360 270V338" stroke="url(#violetRail)" stroke-width="2.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <circle cx="360" cy="290" r="8" fill="#0A0B0F" stroke="url(#silver)" stroke-width="1.2"/>
  <circle cx="360" cy="290" r="4.2" fill="url(#violetCore)"/>

