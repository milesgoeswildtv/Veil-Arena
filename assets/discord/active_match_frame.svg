  <!-- impact spark accents confined to border bands -->
  <g fill="#ff456e" opacity=".78" filter="url(#glow)">
    <circle cx="153" cy="153" r="4.5"/>
    <circle cx="871" cy="153" r="4.5"/>
    <circle cx="153" cy="871" r="4.5"/>
