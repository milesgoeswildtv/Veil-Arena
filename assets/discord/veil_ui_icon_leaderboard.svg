<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Leaderboard</title>
  <desc>96x96 transparent Veil leaderboard/rankings icon. Three-tier podium crest in silver/gunmetal with restrained violet highlights, designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_leaderboard.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DEFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#C88DEB" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#7B4A9E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#593576" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreBloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Ranked backing plate -->
  <path d="M24 63L27 36H69L72 63L64 71H32Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Three-tier podium: center highest -->
  <path d="M28 61V49
           C28 47.9 28.9 47 30 47H40
           C41.1 47 42 47.9 42 49V61Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M42 61V39
           C42 37.9 42.9 37 44 37H52
           C53.1 37 54 37.9 54 39V61Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M54 61V45
           C54 43.9 54.9 43 56 43H66
           C67.1 43 68 43.9 68 45V61Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Podium top rails / leaderboard highlights -->
  <path d="M30.5 49H39.5" stroke="url(#violet)" stroke-width="1.35" stroke-linecap="round" opacity="0.70"/>
  <path d="M44.5 39H51.5" stroke="url(#violet)" stroke-width="1.55" stroke-linecap="round" opacity="0.82"/>
  <path d="M56.5 45H65.5" stroke="url(#violet)" stroke-width="1.35" stroke-linecap="round" opacity="0.70"/>

  <!-- Ranking notches to imply standings board -->
  <g stroke="#7E8188" stroke-width="0.95" stroke-linecap="round" opacity="0.82">
    <path d="M31.5 54H38.5"/>
    <path d="M45 46H51"/>
    <path d="M57.5 50H64.5"/>
  </g>

  <!-- Central champion marker, distinct from crown icon -->
  <circle cx="48" cy="30.5" r="7.2"
          fill="#090A0D"
          stroke="url(#silver)"
          stroke-width="1.35"/>
  <circle cx="48" cy="30.5" r="3.9"
          fill="url(#coreGlow)"
          filter="url(#coreBloom)"/>
  <circle cx="48" cy="30.5" r="1.45" fill="#F3E7FF"/>

  <!-- Small ascending rank chevrons -->
  <path d="M34 31L37 27L40 31" fill="none" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 31L59 27L62 31" fill="none" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower champion line -->
  <path d="M35 67H61"
        stroke="url(#silver)"
        stroke-width="1.35"
        stroke-linecap="round"
        opacity="0.92"/>

  <!-- Small side fins / family details -->
  <path d="M21 39L15 44L22 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <path d="M75 39L81 44L74 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Tiny family gate ticks -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
