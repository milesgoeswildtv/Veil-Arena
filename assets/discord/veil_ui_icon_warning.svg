<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Warning</title>
  <desc>96x96 transparent Veil warning icon. Angular hazard crest in silver and gunmetal with a dark recessed center, controlled amber warning core, and a subtle violet family accent. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_warning.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A85B16"/>
      <stop offset="0.52" stop-color="#E6A33A"/>
      <stop offset="1" stop-color="#7E3C12"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="amberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF0C9" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#F3B34C" stop-opacity="0.98"/>
      <stop offset="0.70" stop-color="#A55A18" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6F310C" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreBloom" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Hazard housing: shield/crest, not a road-sign triangle -->
  <path d="M48 23
           L67 32
           L63 58
           L48 71
           L33 58
           L29 32
           Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="1.9"
        stroke-linejoin="round"/>

  <!-- Inner warning plate -->
  <path d="M48 29
           L60 35
           L57 54
           L48 62
           L39 54
           L36 35
           Z"
        fill="url(#gunmetal)"
        stroke="#34373D"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Amber hazard rails -->
  <path d="M41 33L48 29L55 33" stroke="url(#amber)" stroke-width="1.3" stroke-linecap="round" opacity="0.82"/>
  <path d="M40 57L48 64L56 57" stroke="url(#amber)" stroke-width="1.15" stroke-linecap="round" opacity="0.58"/>

  <!-- Core warning mark -->
  <path d="M48 37V49" stroke="url(#silver)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="48" cy="55" r="2.3" fill="url(#silver)"/>

  <!-- Amber warning core behind the mark -->
  <circle cx="48" cy="47.5" r="8.4" fill="#090A0D" stroke="url(#silver)" stroke-width="1.25"/>
  <circle cx="48" cy="47.5" r="4.7" fill="url(#amberCore)" filter="url(#coreBloom)"/>
  <circle cx="48" cy="47.5" r="1.45" fill="#FFF4D8"/>

  <!-- Side alert brackets -->
  <path d="M25 42L19 48L25 54" fill="#0E1014" stroke="url(#silver)" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M71 42L77 48L71 54" fill="#0E1014" stroke="url(#silver)" stroke-width="1.15" stroke-linejoin="round"/>

  <!-- Small supporting caution lines -->
  <path d="M34 63H43" stroke="url(#silver)" stroke-width="1.1" stroke-linecap="round" opacity="0.78"/>
  <path d="M53 63H62" stroke="url(#silver)" stroke-width="1.1" stroke-linecap="round" opacity="0.78"/>

  <!-- Tiny violet family accent so it still belongs to the Veil set -->
  <path d="M48 20V17" stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.50"/>
  <path d="M48 75V78" stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44"/>
  <path d="M18 48H21" stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44"/>
  <path d="M75 48H78" stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44"/>

  <!-- Small protocol notch with violet accent -->
  <path d="M43 25H53L55 29H41Z" fill="#101218" stroke="url(#silver)" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M46 27.5H50" stroke="url(#violet)" stroke-width="1.0" stroke-linecap="round" opacity="0.72"/>
</svg>
