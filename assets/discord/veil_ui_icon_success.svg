<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Success</title>
  <desc>96x96 transparent Veil success icon. Angular confirmation crest in silver and gunmetal with a restrained emerald confirmation core, a sharp segmented confirmation mark, and subtle violet family accents. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_success.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D7B61"/>
      <stop offset="0.52" stop-color="#58D3A2"/>
      <stop offset="1" stop-color="#1D5545"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="emeraldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ECFFF6" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#77E5B7" stop-opacity="0.98"/>
      <stop offset="0.70" stop-color="#2F7A61" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1B4D3E" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreBloom" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Confirmation housing -->
  <path d="M48 23
           L67 32
           L63 58
           L48 71
           L33 58
           L29 32
           Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="1.9"
        stroke-linejoin="round"/>

  <!-- Inner confirmation plate -->
  <path d="M48 29
           L60 35
           L57 54
           L48 62
           L39 54
           L36 35
           Z"
        fill="url(#gunmetal)"
        stroke="#34373D"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Emerald confirmation rails -->
  <path d="M41 33L48 29L55 33" stroke="url(#emerald)" stroke-width="1.3" stroke-linecap="round" opacity="0.84"/>
  <path d="M40 57L48 64L56 57" stroke="url(#emerald)" stroke-width="1.15" stroke-linecap="round" opacity="0.62"/>

  <!-- Confirmation core -->
  <circle cx="48" cy="47.5" r="8.6" fill="#090A0D" stroke="url(#silver)" stroke-width="1.25"/>
  <circle cx="48" cy="47.5" r="4.9" fill="url(#emeraldCore)" filter="url(#coreBloom)"/>
  <circle cx="48" cy="47.5" r="1.45" fill="#F4FFF8"/>

  <!-- Sharp segmented confirmation mark -->
  <path d="M41 48.5L45.3 53L56 42.2"
        fill="none"
        stroke="url(#silver)"
        stroke-width="2.0"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M42.2 48.4L45.4 51.7L54.4 43.1"
        fill="none"
        stroke="url(#emerald)"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Side confirmation brackets -->
  <path d="M25 42L19 48L25 54" fill="#0E1014" stroke="url(#silver)" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M71 42L77 48L71 54" fill="#0E1014" stroke="url(#silver)" stroke-width="1.15" stroke-linejoin="round"/>

  <!-- Supporting completion lines -->
  <path d="M34 63H43" stroke="url(#silver)" stroke-width="1.1" stroke-linecap="round" opacity="0.78"/>
  <path d="M53 63H62" stroke="url(#silver)" stroke-width="1.1" stroke-linecap="round" opacity="0.78"/>

  <!-- Tiny violet family accents -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 17V20"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>

  <!-- Small top protocol notch -->
  <path d="M43 25H53L55 29H41Z" fill="#101218" stroke="url(#silver)" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M46 27.5H50" stroke="url(#violet)" stroke-width="1.0" stroke-linecap="round" opacity="0.72"/>
</svg>
