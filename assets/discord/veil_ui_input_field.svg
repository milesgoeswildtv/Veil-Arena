<svg xmlns="http://www.w3.org/2000/svg" width="960" height="192" viewBox="0 0 960 192" fill="none">
  <title>Veil UI Input Field</title>
  <desc>Responsive 960x192 Veil Arena input field frame. Transparent exterior, 5:1 ratio, protected 144px end caps, 672px stretch-safe center, no baked-in text.</desc>

  <metadata>
    asset: veil_ui_input_field.svg
    canvas: 960x192
    aspect-ratio: 5:1
    transparent-background: true
    protected-end-caps: 144px left / 144px right
    stretch-safe-center: x=144..816
    intended-css-height: 48-56px
    text: live HTML/CSS only
  </metadata>

  <defs>
    <linearGradient id="gmOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8D9DE"/>
      <stop offset="0.18" stop-color="#777A82"/>
      <stop offset="0.46" stop-color="#C6C8CE"/>
      <stop offset="0.72" stop-color="#4F525B"/>
      <stop offset="1" stop-color="#9B9EA7"/>
    </linearGradient>

    <linearGradient id="gmInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1B21"/>
      <stop offset="0.48" stop-color="#07080B"/>
      <stop offset="1" stop-color="#111218"/>
    </linearGradient>

    <linearGradient id="recessFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F"/>
      <stop offset="0.44" stop-color="#12131A"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="violetEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C356A"/>
      <stop offset="0.18" stop-color="#6D4E90"/>
      <stop offset="0.5" stop-color="#5E427C"/>
      <stop offset="0.82" stop-color="#6D4E90"/>
      <stop offset="1" stop-color="#4C356A"/>
    </linearGradient>

    <radialGradient id="capAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7A5A9A" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#694987" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#694987" stop-opacity="0"/>
    </radialGradient>

    <filter id="edgeGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>

    <pattern id="microTexture" width="46" height="28" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="8" r="0.48" fill="#FFFFFF" opacity="0.028"/>
      <circle cx="31" cy="18" r="0.42" fill="#9C83B3" opacity="0.032"/>
      <path d="M15 22l8-1" stroke="#FFFFFF" stroke-width="0.38" opacity="0.018"/>
      <path d="M37 6l5 1" stroke="#FFFFFF" stroke-width="0.34" opacity="0.016"/>
    </pattern>

    <clipPath id="fieldClip">
      <rect x="88" y="62" width="784" height="68" rx="26"/>
    </clipPath>
  </defs>

  <!-- True transparent exterior -->
  <ellipse cx="102" cy="96" rx="82" ry="54" fill="url(#capAmbient)" opacity="0.28" filter="url(#ambientGlow)"/>
  <ellipse cx="858" cy="96" rx="82" ry="54" fill="url(#capAmbient)" opacity="0.28" filter="url(#ambientGlow)"/>

  <!-- Same overall family silhouette as Assets 01–02, but visibly recessed -->
  <rect x="60" y="48" width="840" height="96" rx="43"
        fill="#0A0B0F" stroke="url(#gmOuter)" stroke-width="4"/>

  <rect x="68" y="55" width="824" height="82" rx="36"
        fill="url(#gmInner)" stroke="#23252C" stroke-width="3"/>

  <rect x="80" y="59" width="800" height="74" rx="31"
        fill="url(#recessFill)" stroke="url(#violetEdge)" stroke-width="1.45"
        filter="url(#edgeGlow)"/>

  <!-- Inner bevel / inset shadow cue -->
  <path d="M108 66H852" stroke="#FFFFFF" stroke-opacity="0.075" stroke-width="1"/>
  <path d="M108 126H852" stroke="#000000" stroke-opacity="0.65" stroke-width="2"/>
  <path d="M104 70H856" stroke="#8A6AA8" stroke-opacity="0.055" stroke-width="1"/>

  <!-- Subtle texture only; center stays clean for live text -->
  <rect x="88" y="62" width="784" height="68" rx="26"
        fill="url(#microTexture)" opacity="0.35"/>

  <!-- Left protected end cap: 0..144 -->
  <g aria-label="left protected end cap">
    <path d="M60 96H22" stroke="url(#gmOuter)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M22 96L50 82V110L22 96Z"
          fill="#101117" stroke="url(#gmOuter)" stroke-width="2.3"/>

    <circle cx="74" cy="96" r="22" fill="#08090D" stroke="url(#gmOuter)" stroke-width="3.2"/>
    <circle cx="74" cy="96" r="13.5" fill="#040509" stroke="#604377" stroke-width="1.3"/>
    <circle cx="74" cy="96" r="3.1" fill="#8F76A7" opacity="0.62"/>

    <path d="M84 79L104 66L96 86" fill="#0F1015" stroke="url(#gmOuter)" stroke-width="1.9"/>
    <path d="M84 113L104 126L96 106" fill="#0F1015" stroke="url(#gmOuter)" stroke-width="1.9"/>

    <path d="M93 96H118" stroke="#6B4F83" stroke-width="1.15" opacity="0.32"/>
    <circle cx="105" cy="66" r="1.45" fill="#755B8B" opacity="0.5"/>
    <circle cx="105" cy="126" r="1.45" fill="#755B8B" opacity="0.5"/>
  </g>

  <!-- Right protected end cap: 816..960 -->
  <g aria-label="right protected end cap">
    <path d="M900 96H938" stroke="url(#gmOuter)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M938 96L910 82V110L938 96Z"
          fill="#101117" stroke="url(#gmOuter)" stroke-width="2.3"/>

    <circle cx="886" cy="96" r="22" fill="#08090D" stroke="url(#gmOuter)" stroke-width="3.2"/>
    <circle cx="886" cy="96" r="13.5" fill="#040509" stroke="#604377" stroke-width="1.3"/>
    <circle cx="886" cy="96" r="3.1" fill="#8F76A7" opacity="0.62"/>

    <path d="M876 79L856 66L864 86" fill="#0F1015" stroke="url(#gmOuter)" stroke-width="1.9"/>
    <path d="M876 113L856 126L864 106" fill="#0F1015" stroke="url(#gmOuter)" stroke-width="1.9"/>

    <path d="M867 96H842" stroke="#6B4F83" stroke-width="1.15" opacity="0.32"/>
    <circle cx="855" cy="66" r="1.45" fill="#755B8B" opacity="0.5"/>
    <circle cx="855" cy="126" r="1.45" fill="#755B8B" opacity="0.5"/>
  </g>

  <!-- Restrained inner cap accents -->
  <g clip-path="url(#fieldClip)" opacity="0.13">
    <path d="M90 74C110 66 128 68 144 76" stroke="#65457E" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M90 118C110 126 128 124 144 116" stroke="#65457E" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M870 74C850 66 832 68 816 76" stroke="#65457E" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M870 118C850 126 832 124 816 116" stroke="#65457E" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- Tiny machining marks, same family language -->
  <g stroke="#E4E4E9" stroke-opacity="0.18" stroke-width="0.9">
    <path d="M126 57l8 5"/>
    <path d="M126 135l8-5"/>
    <path d="M834 57l-8 5"/>
    <path d="M834 135l-8-5"/>
  </g>

  <!-- Non-rendering production guides -->
  <g opacity="0" pointer-events="none">
    <rect id="left-cap" x="0" y="0" width="144" height="192"/>
    <rect id="stretch-safe-center" x="144" y="0" width="672" height="192"/>
    <rect id="right-cap" x="816" y="0" width="144" height="192"/>
  </g>
</svg>
