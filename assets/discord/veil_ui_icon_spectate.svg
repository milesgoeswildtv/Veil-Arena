<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Spectate</title>
  <desc>96x96 transparent Veil spectate/watch icon. Angular mechanical eye crest in silver/gunmetal with a dark recessed pupil and restrained violet iris/core. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_spectate.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DEFF" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#C88DEB" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#7B4A9E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#593576" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreBloom" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Spectate eye housing -->
  <path d="M18 48
           C23 38 34 30 48 30
           C62 30 73 38 78 48
           C73 58 62 66 48 66
           C34 66 23 58 18 48Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="2.0"
        stroke-linejoin="round"/>

  <!-- Inner mechanical eye plate -->
  <path d="M24 48
           C28 40.8 36.6 35.6 48 35.6
           C59.4 35.6 68 40.8 72 48
           C68 55.2 59.4 60.4 48 60.4
           C36.6 60.4 28 55.2 24 48Z"
        fill="url(#gunmetal)"
        stroke="#34373D"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Mechanical inner aperture -->
  <path d="M31 48
           C34.2 43.3 40.2 40 48 40
           C55.8 40 61.8 43.3 65 48
           C61.8 52.7 55.8 56 48 56
           C40.2 56 34.2 52.7 31 48Z"
        fill="#090A0D"
        stroke="url(#violet)"
        stroke-width="1.35"
        stroke-opacity="0.62"
        stroke-linejoin="round"/>

  <!-- Iris / observer core -->
  <circle cx="48" cy="48" r="8.4"
          fill="#08090C"
          stroke="url(#silver)"
          stroke-width="1.4"/>

  <circle cx="48" cy="48" r="4.9"
          fill="url(#irisGlow)"
          filter="url(#coreBloom)"/>

  <circle cx="48" cy="48" r="1.7" fill="#F4E9FF"/>

  <!-- Recessed pupil -->
  <circle cx="48" cy="48" r="2.5" fill="#090A0D"/>

  <!-- Upper and lower observation rails -->
  <path d="M30 43
           C35 39.4 41 37.6 48 37.6
           C55 37.6 61 39.4 66 43"
        fill="none"
        stroke="url(#violet)"
        stroke-width="1.25"
        stroke-linecap="round"
        opacity="0.68"/>

  <path d="M30 53
           C35 56.6 41 58.4 48 58.4
           C55 58.4 61 56.6 66 53"
        fill="none"
        stroke="url(#silver)"
        stroke-width="1.0"
        stroke-linecap="round"
        opacity="0.72"/>

  <!-- Side lens fins / observer brackets -->
  <path d="M23 43L16 48L23 53"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <path d="M73 43L80 48L73 53"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Small top sensor notch -->
  <path d="M43 28H53L55 32H41Z"
        fill="#101218"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Tiny family gate ticks -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
