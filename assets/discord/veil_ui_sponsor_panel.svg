  <path d="M178 240H782L806 260V426L782 448H178L162 434V256Z" fill="#05070B"/>
  <path d="M178 240H782L806 260V426L782 448H178L162 434V256Z" fill="url(#microNoise)" opacity="0.16"/>

  <!-- ceremonial center plaque -->
  <path d="M250 272H710L734 294V360L710 382H250L226 360V294Z"
