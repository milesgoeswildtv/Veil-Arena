  <circle cx="480" cy="326" r="34" fill="#07090D" stroke="url(#valueRail)" stroke-width="1.8"/>
  <circle cx="480" cy="326" r="25" fill="#04060A" stroke="#F4F7FF" stroke-opacity="0.08" stroke-width="1.0"/>
  <circle cx="480" cy="326" r="18" fill="url(#violetCore)" filter="url(#softGlow)"/>
  <circle cx="480" cy="326" r="11.5" fill="url(#softSilverCore)" opacity="0.84" filter="url(#softGlow)"/>
  <circle cx="480" cy="326" r="5.0" fill="#FFFFFF" fill-opacity="0.96"/>
  <path d="M466 318L474 326L466 334" fill="none" stroke="url(#silverRail)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <path d="M494 318L486 326L494 334" fill="none" stroke="url(#silverRail)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <path d="M448 326H462" stroke="url(#silverRail)" stroke-width="1.5" stroke-linecap="round" opacity="0.80"/>
  <path d="M498 326H512" stroke="url(#silverRail)" stroke-width="1.5" stroke-linecap="round" opacity="0.80"/>

  <!-- top sponsor core -->
  <path d="M480 34V120" stroke="url(#violetRail)" stroke-width="2.35" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M450 54H510" stroke="url(#silverRail)" stroke-width="1.1" stroke-linecap="round" opacity="0.86"/>
  <circle cx="480" cy="90" r="14" fill="url(#violetCore)" filter="url(#softGlow)"/>
  <circle cx="480" cy="90" r="9.3" fill="url(#softSilverCore)" opacity="0.82" filter="url(#softGlow)"/>
  <circle cx="480" cy="90" r="5.1" fill="#FFFFFF" fill-opacity="0.96"/>
  <!-- restrained crest -->
  <path d="M463 62L471 52L480 62L489 52L497 62" fill="none" stroke="url(#silverEdge)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" opacity="0.86"/>
  <path d="M467 66H493" stroke="url(#violetRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.34"/>

  <!-- subtle value orbit arcs -->
  <path d="M438 306C448 292 462 284 480 284C498 284 512 292 522 306" fill="none" stroke="url(#valueRail)" stroke-width="1.15" stroke-linecap="round" opacity="0.34"/>
  <path d="M438 346C448 360 462 368 480 368C498 368 512 360 522 346" fill="none" stroke="url(#valueRail)" stroke-width="1.15" stroke-linecap="round" opacity="0.30"/>

  <!-- footer strip -->
  <path d="M164 496H796L824 520V554L796 578H164L144 562V510Z"
        fill="#07090D" stroke="#2B3039" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M178 510H782L806 530V550L782 564H178L162 552V520Z" fill="#05070B"/>
  <path d="M178 510H782L806 530V550L782 564H178L162 552V520Z" fill="url(#microNoise)" opacity="0.18"/>

  <!-- footer guide zones only -->
  <path d="M206 528H398" stroke="#F3F5FA" stroke-opacity="0.05" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M562 528H754" stroke="#F3F5FA" stroke-opacity="0.05" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M220 546H384" stroke="url(#violetRail)" stroke-opacity="0.11" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M576 546H740" stroke="url(#violetRail)" stroke-opacity="0.11" stroke-width="1.0" stroke-linecap="round"/>

  <!-- global rails for sponsor state -->
  <path d="M152 90H808" stroke="url(#valueRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.92" filter="url(#edgeGlow)"/>
  <path d="M170 104H790" stroke="url(#violetRail)" stroke-opacity="0.12" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M152 550H808" stroke="url(#valueRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.92" filter="url(#edgeGlow)"/>
  <path d="M170 536H790" stroke="url(#violetRail)" stroke-opacity="0.12" stroke-width="1.0" stroke-linecap="round"/>
