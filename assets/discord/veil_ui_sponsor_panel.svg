  <!-- ceremonial side plates -->
  <path d="M212 292H326L340 305V337L326 350H212L198 337V305Z" fill="#05070B" stroke="#222730" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M634 292H748L762 305V337L748 350H634L620 337V305Z" fill="#05070B" stroke="#222730" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- premium value/transfer motif -->
  <path d="M294 326H416" stroke="url(#silverRail)" stroke-opacity="0.18" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M544 326H666" stroke="url(#silverRail)" stroke-opacity="0.18" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M310 318H348" stroke="url(#valueRail)" stroke-width="1.3" stroke-linecap="round" opacity="0.44"/>
  <path d="M612 318H650" stroke="url(#valueRail)" stroke-width="1.3" stroke-linecap="round" opacity="0.44"/>
  <path d="M354 318H402L420 326L402 334H354" fill="none" stroke="url(#silverRail)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" opacity="0.76"/>
  <path d="M606 318H558L540 326L558 334H606" fill="none" stroke="url(#silverRail)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" opacity="0.76"/>

