  <path d="M204 398H442L458 412V436L442 450H204L190 438V410Z"
        fill="#06080C" stroke="#232831" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M518 398H756L772 412V436L756 450H518L504 438V410Z"
