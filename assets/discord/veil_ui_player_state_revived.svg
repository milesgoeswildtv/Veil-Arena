<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none">
  <title>Veil UI Player State Revived</title>
  <desc>720x360 transparent overlay for the Veil UI player card. Adds REVIVED state treatment only: brighter emerald rails, faint violet secondary pulse, reconnected portrait-edge rail, and stronger corner/core activity to suggest energy returning online. No base card body or text is duplicated.</desc>

  <metadata>
    asset: veil_ui_player_state_revived.svg
    family: veil_ui_player_card.svg
    canvas: 720x360
    aspect-ratio: 2:1
    transparent-background: true
    overlay-only: true
    alignment: exact match to veil_ui_player_card.svg
    text: none
    intended-use: revived state overlay
  </metadata>

  <defs>
    <linearGradient id="emeraldRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E6149"/>
      <stop offset="0.18" stop-color="#2C9870"/>
      <stop offset="0.50" stop-color="#79EDB9"/>
      <stop offset="0.82" stop-color="#2C9870"/>
      <stop offset="1" stop-color="#1E6149"/>
    </linearGradient>

    <linearGradient id="violetRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E265C"/>
      <stop offset="0.20" stop-color="#7750A4"/>
      <stop offset="0.50" stop-color="#B57AE4"/>
      <stop offset="0.80" stop-color="#7750A4"/>
      <stop offset="1" stop-color="#3E265C"/>
    </linearGradient>

    <linearGradient id="emeraldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7FFF4" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#8CF0C2" stop-opacity="0.82"/>
      <stop offset="0.70" stop-color="#36A177" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#214F40" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="emeraldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5FFF9" stop-opacity="1"/>
      <stop offset="0.26" stop-color="#9EF4CC" stop-opacity="0.92"/>
      <stop offset="0.64" stop-color="#43AF84" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#43AF84" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F3E6FF" stop-opacity="0.95"/>
      <stop offset="0.30" stop-color="#D4A0FF" stop-opacity="0.50"/>
      <stop offset="0.72" stop-color="#7F50A6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7F50A6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>

    <filter id="edgeGlow" x="-20%" y="-140%" width="140%" height="380%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="portraitGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- top/bottom REVIVED rails -->
  <path d="M108 68H612" stroke="url(#emeraldRail)" stroke-width="2.3" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M124 80H596" stroke="#A0FFD3" stroke-opacity="0.18" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M154 74H566" stroke="url(#violetRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.20"/>

  <path d="M108 292H612" stroke="url(#emeraldRail)" stroke-width="2.3" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M124 280H596" stroke="#A0FFD3" stroke-opacity="0.18" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M154 286H566" stroke="url(#violetRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.18"/>

  <!-- slightly stronger side response -->
  <path d="M76 114V246" stroke="url(#emeraldRail)" stroke-width="1.9" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M644 114V246" stroke="url(#emeraldRail)" stroke-width="1.6" stroke-linecap="round" opacity="0.62" filter="url(#edgeGlow)"/>

  <!-- portrait edge rail, reconnected -->
  <path d="M52 74H190L220 104V256L190 286H52L34 268V92Z"
        fill="none"
        stroke="url(#emeraldSoft)"
        stroke-width="2.3"
        stroke-linejoin="round"
        filter="url(#portraitGlow)"/>
  <path d="M60 82H184L210 108V252L184 278H60L42 262V98Z"
        fill="none"
        stroke="#9EF3C9"
        stroke-opacity="0.22"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- reconnected seam pulses -->
  <path d="M52 74H118" stroke="url(#violetRail)" stroke-width="0.95" stroke-linecap="round" opacity="0.24"/>
  <path d="M160 286H190" stroke="url(#violetRail)" stroke-width="0.95" stroke-linecap="round" opacity="0.22"/>
  <path d="M34 268V210" stroke="url(#violetRail)" stroke-width="0.9" stroke-linecap="round" opacity="0.18"/>

  <!-- portrait energy arcs / returning online -->
  <path d="M72 102C96 85 126 81 154 89" fill="none" stroke="url(#emeraldRail)" stroke-width="1.25" stroke-linecap="round" opacity="0.66"/>
  <path d="M80 258C103 272 134 273 159 262" fill="none" stroke="url(#emeraldRail)" stroke-width="1.15" stroke-linecap="round" opacity="0.54"/>
  <path d="M83 118C106 111 134 113 160 123" fill="none" stroke="url(#violetRail)" stroke-width="0.95" stroke-linecap="round" opacity="0.20"/>

  <!-- center crest activity, revived online -->
  <path d="M360 22V90" stroke="url(#emeraldRail)" stroke-width="2.5" stroke-linecap="round" opacity="0.92" filter="url(#edgeGlow)"/>
  <path d="M360 30V82" stroke="url(#violetRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.22"/>
  <circle cx="360" cy="70" r="11.6" fill="url(#emeraldCore)" filter="url(#softGlow)"/>
  <circle cx="360" cy="70" r="8.2" fill="url(#violetCore)" opacity="0.32" filter="url(#softGlow)"/>
  <circle cx="360" cy="70" r="4.6" fill="#F0FFF8" fill-opacity="0.96"/>

  <path d="M360 270V338" stroke="url(#emeraldRail)" stroke-width="2.3" stroke-linecap="round" opacity="0.82" filter="url(#edgeGlow)"/>
  <path d="M360 278V330" stroke="url(#violetRail)" stroke-width="0.95" stroke-linecap="round" opacity="0.18"/>
  <circle cx="360" cy="290" r="10.4" fill="url(#emeraldCore)" filter="url(#softGlow)"/>
  <circle cx="360" cy="290" r="7.2" fill="url(#violetCore)" opacity="0.28" filter="url(#softGlow)"/>
  <circle cx="360" cy="290" r="4.1" fill="#F0FFF8" fill-opacity="0.90"/>

  <!-- corner/core activity, slightly stronger than ALIVE -->
  <g>
    <circle cx="78" cy="78" r="26" fill="url(#emeraldCore)" opacity="0.40" filter="url(#softGlow)"/>
    <circle cx="78" cy="78" r="18" fill="url(#violetCore)" opacity="0.20" filter="url(#softGlow)"/>
    <circle cx="78" cy="78" r="7.2" fill="#EFFFF7" fill-opacity="0.94"/>
    <path d="M61 78A17 17 0 0 1 78 61" fill="none" stroke="url(#emeraldRail)" stroke-width="1.7" stroke-linecap="round" opacity="0.80"/>
  </g>
  <g>
    <circle cx="642" cy="78" r="26" fill="url(#emeraldCore)" opacity="0.34" filter="url(#softGlow)"/>
    <circle cx="642" cy="78" r="18" fill="url(#violetCore)" opacity="0.18" filter="url(#softGlow)"/>
    <circle cx="642" cy="78" r="6.8" fill="#EFFFF7" fill-opacity="0.88"/>
    <path d="M659 78A17 17 0 0 0 642 61" fill="none" stroke="url(#emeraldRail)" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
  </g>
  <g>
    <circle cx="78" cy="282" r="25" fill="url(#emeraldCore)" opacity="0.28" filter="url(#softGlow)"/>
    <circle cx="78" cy="282" r="16" fill="url(#violetCore)" opacity="0.15" filter="url(#softGlow)"/>
    <circle cx="78" cy="282" r="6.2" fill="#EFFFF7" fill-opacity="0.82"/>
    <path d="M61 282A17 17 0 0 0 78 299" fill="none" stroke="url(#emeraldRail)" stroke-width="1.5" stroke-linecap="round" opacity="0.66"/>
  </g>
  <g>
    <circle cx="642" cy="282" r="25" fill="url(#emeraldCore)" opacity="0.24" filter="url(#softGlow)"/>
    <circle cx="642" cy="282" r="16" fill="url(#violetCore)" opacity="0.14" filter="url(#softGlow)"/>
    <circle cx="642" cy="282" r="6.0" fill="#EFFFF7" fill-opacity="0.78"/>
    <path d="M659 282A17 17 0 0 1 642 299" fill="none" stroke="url(#emeraldRail)" stroke-width="1.5" stroke-linecap="round" opacity="0.62"/>
  </g>

  <!-- lower strip restored activity -->
  <path d="M259 257H642" stroke="url(#emeraldRail)" stroke-width="1.2" stroke-linecap="round" opacity="0.24"/>
  <path d="M282 272H620" stroke="url(#violetRail)" stroke-width="0.9" stroke-linecap="round" opacity="0.10"/>
  <path d="M272 278H632" stroke="#C5FFE4" stroke-opacity="0.10" stroke-width="1.0" stroke-linecap="round"/>
</svg>
