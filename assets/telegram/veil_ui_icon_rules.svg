<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Rules</title>
  <desc>96x96 transparent Veil rules/protocol icon. Angular metallic scroll-document crest in silver/gunmetal with engraved rule lines and a restrained violet protocol seal. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_rules.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="sealCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DEFF" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#C98CEB" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#7B4A9E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#593576" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreGlow" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Document / protocol plate -->
  <path d="M28 22
           H58
           L68 32
           V64
           C68 67.3 65.3 70 62 70
           H34
           C30.7 70 28 67.3 28 64Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="2.0"
        stroke-linejoin="round"/>

  <!-- Folded corner -->
  <path d="M58 22V29
           C58 30.7 59.3 32 61 32H68"
        fill="none"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Inner plate -->
  <path d="M33 28
           H55.5
           L63 35.5
           V61
           C63 62.7 61.7 64 60 64
           H36
           C34.3 64 33 62.7 33 61Z"
        fill="url(#gunmetal)"
        stroke="#34373D"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Engraved rule/protocol lines -->
  <g stroke="url(#silver)" stroke-width="1.5" stroke-linecap="round" opacity="0.95">
    <path d="M38 38H57"/>
    <path d="M38 45H58"/>
    <path d="M38 52H54"/>
  </g>

  <g stroke="#7A7E87" stroke-width="0.9" stroke-linecap="round" opacity="0.85">
    <path d="M38 41H52"/>
    <path d="M38 48H50"/>
    <path d="M38 55H47"/>
  </g>

  <!-- Left metallic scroll spine -->
  <path d="M24 27
           C20 29 18 33 18 37
           V56
           C18 61 22 66 28 66
           C24 63.5 23 60.5 23 57V36
           C23 32 24 29.2 28 27Z"
        fill="#111318"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Protocol seal -->
  <circle cx="61" cy="60" r="8.2"
          fill="#090A0D"
          stroke="url(#silver)"
          stroke-width="1.35"/>

  <circle cx="61" cy="60" r="4.2"
          fill="url(#sealCore)"
          filter="url(#coreGlow)"/>

  <circle cx="61" cy="60" r="1.55"
          fill="#F2E7FF"/>

  <!-- Tiny protocol glyph within seal -->
  <path d="M61 55.8L58.6 59.2L61 62.2L63.4 59.2Z"
        fill="none"
        stroke="url(#violet)"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Subtle lower scroll cue -->
  <path d="M35 69H55"
        stroke="url(#silver)"
        stroke-width="1.25"
        stroke-linecap="round"
        opacity="0.92"/>

  <!-- Small side fins / family details -->
  <path d="M21 39L15 44L22 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <path d="M75 39L81 44L74 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Tiny family gate ticks -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
