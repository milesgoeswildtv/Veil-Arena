<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Stats</title>
  <desc>96x96 transparent Veil statistics/performance icon. Angular data panel with three performance bars in silver/gunmetal and restrained violet highlights. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_stats.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DEFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#C88DEB" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#7B4A9E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#593576" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreBloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Stats backing panel -->
  <path d="M24 28
           H68
           C70.2 28 72 29.8 72 32
           V62
           C72 64.2 70.2 66 68 66
           H28
           C25.8 66 24 64.2 24 62Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="1.9"
        stroke-linejoin="round"/>

  <!-- Inner panel -->
  <path d="M29 33
           H64
           C66.2 33 68 34.8 68 37
           V58
           C68 60.2 66.2 62 64 62
           H32
           C30.3 62 29 60.7 29 59Z"
        fill="url(#gunmetal)"
        stroke="#34373D"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Axis / baseline -->
  <path d="M33 58H63" stroke="url(#silver)" stroke-width="1.4" stroke-linecap="round" opacity="0.94"/>
  <path d="M33 58V39" stroke="#8C9098" stroke-width="1.1" stroke-linecap="round" opacity="0.88"/>

  <!-- Three-bar performance graph -->
  <path d="M38 58V50
           C38 48.9 38.9 48 40 48
           H42
           C43.1 48 44 48.9 44 50
           V58Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="1.25"
        stroke-linejoin="round"/>

  <path d="M47 58V43
           C47 41.9 47.9 41 49 41
           H51
           C52.1 41 53 41.9 53 43
           V58Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="1.25"
        stroke-linejoin="round"/>

  <path d="M56 58V37
           C56 35.9 56.9 35 58 35
           H60
           C61.1 35 62 35.9 62 37
           V58Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="1.25"
        stroke-linejoin="round"/>

  <!-- Violet performance highlights -->
  <path d="M40 48V58" stroke="url(#violet)" stroke-width="1.25" stroke-linecap="round" opacity="0.72"/>
  <path d="M49 41V58" stroke="url(#violet)" stroke-width="1.4" stroke-linecap="round" opacity="0.80"/>
  <path d="M58 35V58" stroke="url(#violet)" stroke-width="1.5" stroke-linecap="round" opacity="0.90"/>

  <!-- Small trend line for data feel -->
  <path d="M37 46L42 44L49 38L58 33"
        fill="none"
        stroke="url(#violet)"
        stroke-width="1.35"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.78"/>

  <circle cx="42" cy="44" r="1.2" fill="#DDBBFA"/>
  <circle cx="49" cy="38" r="1.25" fill="#E4C9FC"/>
  <circle cx="58" cy="33" r="1.35" fill="#F0DEFF"/>

  <!-- Stats core node -->
  <circle cx="64" cy="26" r="5.8"
          fill="#090A0D"
          stroke="url(#silver)"
          stroke-width="1.2"/>
  <circle cx="64" cy="26" r="3.0"
          fill="url(#coreGlow)"
          filter="url(#coreBloom)"/>
  <circle cx="64" cy="26" r="1.15" fill="#F3E7FF"/>

  <!-- Side panel notches -->
  <path d="M26 40H20" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M26 52H20" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M70 40H76" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M70 52H76" stroke="url(#silver)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Small side fins / family details -->
  <path d="M21 39L15 44L22 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <path d="M75 39L81 44L74 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Tiny family gate ticks -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
