  <path d="M178 242H782L806 262V334L782 354H178L162 342V258Z" fill="#05070B"/>
  <path d="M178 242H782L806 262V334L782 354H178L162 342V258Z" fill="url(#microNoise)" opacity="0.14"/>

  <!-- top 3 podium-like slots without actual rank numbers -->
  <path d="M210 286H354L370 300V330L354 344H210L194 330V300Z"
        fill="#06080C" stroke="#242932" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M394 270H566L584 286V330L566 346H394L376 330V286Z"
        fill="#06080C" stroke="url(#championRail)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M606 286H750L766 300V330L750 344H606L590 330V300Z"
        fill="#06080C" stroke="#242932" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- subtle champion emphasis -->
  <path d="M422 282H538" stroke="url(#championRail)" stroke-width="1.25" stroke-linecap="round" opacity="0.72"/>
  <path d="M438 338H522" stroke="url(#violetRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.26"/>
  <circle cx="480" cy="308" r="16" fill="url(#violetCore)" filter="url(#softGlow)"/>
  <circle cx="480" cy="308" r="10" fill="url(#softSilverCore)" opacity="0.78" filter="url(#softGlow)"/>
  <circle cx="480" cy="308" r="4.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M464 286L472 278L480 286L488 278L496 286" fill="none" stroke="url(#rankRail)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
  <path d="M468 290H492" stroke="url(#violetRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.34"/>

  <!-- ranking list stage -->
  <path d="M164 388H796L824 412V504L796 528H164L144 512V404Z"
        fill="#07090D" stroke="#2B3039" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M178 402H782L806 422V494L782 514H178L162 502V418Z" fill="#05070B"/>
  <path d="M178 402H782L806 422V494L782 514H178L162 502V418Z" fill="url(#microNoise)" opacity="0.14"/>

  <!-- structured ranking rows -->
  <g>
    <path d="M198 420H762L774 432V446L762 458H198L186 448V430Z"
          fill="#05070B" stroke="#232831" stroke-width="1.0" stroke-linejoin="round"/>
    <path d="M198 462H762L774 474V488L762 500H198L186 490V472Z"
          fill="#05070B" stroke="#232831" stroke-width="1.0" stroke-linejoin="round"/>
  </g>

  <!-- rank marker columns -->
  <path d="M216 430H256L266 439L256 448H216L206 439Z" fill="#04060A" stroke="url(#rankRail)" stroke-width="1.0"/>
  <path d="M216 472H256L266 481L256 490H216L206 481Z" fill="#04060A" stroke="url(#rankRail)" stroke-width="1.0"/>

  <!-- player/content lanes -->
  <path d="M286 438H564" stroke="#F4F7FF" stroke-opacity="0.055" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M286 480H564" stroke="#F4F7FF" stroke-opacity="0.055" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M596 438H740" stroke="url(#violetRail)" stroke-opacity="0.12" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M596 480H740" stroke="url(#violetRail)" stroke-opacity="0.12" stroke-width="1.0" stroke-linecap="round"/>

  <!-- hierarchy guide nodes -->
  <circle cx="236" cy="439" r="7" fill="url(#softSilverCore)" opacity="0.78"/>
  <circle cx="236" cy="481" r="6.5" fill="url(#softSilverCore)" opacity="0.64"/>
  <circle cx="728" cy="439" r="5.5" fill="url(#violetCore)" opacity="0.46"/>
  <circle cx="728" cy="481" r="5.0" fill="url(#violetCore)" opacity="0.34"/>

  <!-- top-center competitive core -->
  <path d="M480 34V120" stroke="url(#violetRail)" stroke-width="2.25" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M450 54H510" stroke="url(#rankRail)" stroke-width="1.05" stroke-linecap="round" opacity="0.84"/>
  <circle cx="480" cy="90" r="13.5" fill="url(#violetCore)" filter="url(#softGlow)"/>
  <circle cx="480" cy="90" r="8.8" fill="url(#softSilverCore)" opacity="0.82" filter="url(#softGlow)"/>
  <circle cx="480" cy="90" r="4.8" fill="#FFFFFF" fill-opacity="0.94"/>

  <!-- footer strip -->
  <path d="M164 544H796L824 568V586L796 606H164L144 592V558Z"
        fill="#07090D" stroke="#2B3039" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M178 558H782L806 576V582L782 592H178L162 584V568Z" fill="#05070B"/>
  <path d="M178 558H782L806 576V582L782 592H178L162 584V568Z" fill="url(#microNoise)" opacity="0.14"/>

  <!-- footer guides -->
  <path d="M208 574H392" stroke="#F3F5FA" stroke-opacity="0.05" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M568 574H752" stroke="#F3F5FA" stroke-opacity="0.05" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M224 586H376" stroke="url(#violetRail)" stroke-opacity="0.10" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M584 586H736" stroke="url(#violetRail)" stroke-opacity="0.10" stroke-width="1.0" stroke-linecap="round"/>

  <!-- shared panel-family rails -->
  <path d="M152 90H808" stroke="url(#rankRail)" stroke-width="1.95" stroke-linecap="round" opacity="0.92" filter="url(#edgeGlow)"/>
  <path d="M170 104H790" stroke="url(#violetRail)" stroke-opacity="0.11" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M152 574H808" stroke="url(#rankRail)" stroke-width="1.95" stroke-linecap="round" opacity="0.90" filter="url(#edgeGlow)"/>
  <path d="M170 560H790" stroke="url(#violetRail)" stroke-opacity="0.10" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M114 142V524" stroke="url(#violetRail)" stroke-width="1.72" stroke-linecap="round" opacity="0.76" filter="url(#edgeGlow)"/>
  <path d="M846 142V524" stroke="url(#violetRail)" stroke-width="1.72" stroke-linecap="round" opacity="0.60" filter="url(#edgeGlow)"/>

  <!-- bottom core -->
  <path d="M480 520V610" stroke="url(#violetRail)" stroke-width="1.9" stroke-linecap="round" opacity="0.56" filter="url(#edgeGlow)"/>
  <circle cx="480" cy="566" r="10.5" fill="url(#violetCore)" filter="url(#softGlow)"/>
  <circle cx="480" cy="566" r="4.1" fill="#FFFFFF" fill-opacity="0.88"/>

  <!-- corner machinery -->
  <g>
    <circle cx="110" cy="104" r="22" fill="#07090D" stroke="url(#silverEdge)" stroke-width="2.0"/>
    <circle cx="110" cy="104" r="12" fill="#05070B" stroke="#72509B" stroke-width="1.1"/>
    <circle cx="110" cy="104" r="4.8" fill="url(#violetCore)"/>
