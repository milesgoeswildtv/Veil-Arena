<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none">
  <title>Veil UI Live Round Panel</title>
  <desc>Reusable Veil active gameplay shell for Arena. True SVG vector, 960 by 640, transparent exterior, no baked-in text. Contains a live round/status header, large central event/action chamber, side telemetry lanes, and a lower action/control strip. Designed for responsive mobile and desktop scaling.</desc>

  <metadata>
    asset: veil_ui_live_round_panel.svg
    family: veil_ui_vote_panel.svg / veil_ui_results_panel.svg / veil_ui_sponsor_panel.svg / veil_ui_rules_panel.svg / veil_ui_stats_panel.svg / veil_ui_leaderboard_panel.svg / veil_ui_lobby_panel.svg
    canvas: 960x640
    aspect-ratio: 3:2
    transparent-background: true
    text: none
    raster: none
    protected-outer-zones: 96px
    content-zones: header, central-event, telemetry-left, telemetry-right, controls
    responsive: mobile + desktop
  </metadata>

  <defs>
    <linearGradient id="silverEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FB"/>
      <stop offset="0.16" stop-color="#9BA1AB"/>
      <stop offset="0.50" stop-color="#DCE1E8"/>
      <stop offset="0.82" stop-color="#5B616C"/>
      <stop offset="1" stop-color="#C5CBD4"/>
    </linearGradient>

    <linearGradient id="gunmetalOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E25"/>
      <stop offset="0.44" stop-color="#090B10"/>
      <stop offset="1" stop-color="#15181E"/>
    </linearGradient>

    <linearGradient id="gunmetalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1015"/>
      <stop offset="0.54" stop-color="#07090D"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>

    <linearGradient id="violetRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A2157"/>
      <stop offset="0.18" stop-color="#7451A3"/>
      <stop offset="0.50" stop-color="#D2A2FF"/>
      <stop offset="0.82" stop-color="#7451A3"/>
      <stop offset="1" stop-color="#3A2157"/>
    </linearGradient>

    <linearGradient id="silverRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#687180"/>
      <stop offset="0.16" stop-color="#B0BAC8"/>
      <stop offset="0.50" stop-color="#F8FAFD"/>
      <stop offset="0.84" stop-color="#B0BAC8"/>
      <stop offset="1" stop-color="#687180"/>
    </linearGradient>

    <linearGradient id="activeRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C2F6E"/>
      <stop offset="0.15" stop-color="#8B63BC"/>
      <stop offset="0.50" stop-color="#EEE4FA"/>
      <stop offset="0.85" stop-color="#8B63BC"/>
      <stop offset="1" stop-color="#4C2F6E"/>
    </linearGradient>

    <radialGradient id="violetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#F7EEFF" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#D5A8FF" stop-opacity="0.84"/>
      <stop offset="0.74" stop-color="#8A5FB7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8A5FB7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softSilverCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="0.46" stop-color="#EDF2F9" stop-opacity="0.42"/>
      <stop offset="0.86" stop-color="#AAB4C1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#AAB4C1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="microNoise" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="0.4" fill="#FFFFFF" opacity="0.019"/>
      <circle cx="16" cy="14" r="0.35" fill="#D2A2FF" opacity="0.013"/>
      <path d="M8 18l4-1" stroke="#FFFFFF" stroke-width="0.28" opacity="0.011"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>

    <filter id="edgeGlow" x="-20%" y="-140%" width="140%" height="380%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- active ambient energy -->
  <ellipse cx="110" cy="104" rx="42" ry="42" fill="url(#violetCore)" opacity="0.16" filter="url(#softGlow)"/>
  <ellipse cx="850" cy="104" rx="42" ry="42" fill="url(#violetCore)" opacity="0.16" filter="url(#softGlow)"/>
  <ellipse cx="110" cy="536" rx="42" ry="42" fill="url(#violetCore)" opacity="0.12" filter="url(#softGlow)"/>
  <ellipse cx="850" cy="536" rx="42" ry="42" fill="url(#violetCore)" opacity="0.12" filter="url(#softGlow)"/>

