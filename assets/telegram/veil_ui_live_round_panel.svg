  <circle cx="640" cy="350" r="8" fill="url(#violetCore)" opacity="0.62" filter="url(#softGlow)"/>
  <circle cx="480" cy="350" r="18" fill="url(#violetCore)" opacity="0.82" filter="url(#softGlow)"/>
