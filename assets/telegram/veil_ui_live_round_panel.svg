  <circle cx="480" cy="547" r="12.5" fill="url(#violetCore)" opacity="0.82" filter="url(#softGlow)"/>
  <circle cx="480" cy="547" r="4.8" fill="#FFFFFF" fill-opacity="0.88"/>

  <!-- top live core -->
  <path d="M480 34V122" stroke="url(#activeRail)" stroke-width="2.3" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M448 54H512" stroke="url(#silverRail)" stroke-width="1.05" stroke-linecap="round" opacity="0.86"/>
  <circle cx="480" cy="90" r="14.5" fill="url(#violetCore)" filter="url(#softGlow)"/>
  <circle cx="480" cy="90" r="9.4" fill="url(#softSilverCore)" opacity="0.82" filter="url(#softGlow)"/>
  <circle cx="480" cy="90" r="5.1" fill="#FFFFFF" fill-opacity="0.96"/>

  <!-- live side energy routing -->
  <path d="M114 142V524" stroke="url(#activeRail)" stroke-width="1.95" stroke-linecap="round" opacity="0.84" filter="url(#edgeGlow)"/>
  <path d="M846 142V524" stroke="url(#activeRail)" stroke-width="1.95" stroke-linecap="round" opacity="0.84" filter="url(#edgeGlow)"/>
  <circle cx="114" cy="250" r="5.6" fill="url(#violetCore)" opacity="0.64"/>
  <circle cx="114" cy="390" r="5.6" fill="url(#violetCore)" opacity="0.64"/>
  <circle cx="846" cy="250" r="5.6" fill="url(#violetCore)" opacity="0.64"/>
  <circle cx="846" cy="390" r="5.6" fill="url(#violetCore)" opacity="0.64"/>

