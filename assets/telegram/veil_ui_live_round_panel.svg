  <path d="M300 388H660" stroke="url(#violetRail)" stroke-width="1.15" stroke-linecap="round" opacity="0.34"/>
  <path d="M278 329V371" stroke="url(#violetRail)" stroke-width="1.2" stroke-linecap="round" opacity="0.30"/>
  <path d="M682 329V371" stroke="url(#violetRail)" stroke-width="1.2" stroke-linecap="round" opacity="0.30"/>

