<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Crown</title>
  <desc>96x96 transparent Veil winner/champion icon. Sharp angular crown crest in silver/gunmetal with restrained violet energy core. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_crown.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="jewelCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DFFF" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#C78BEA" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#7A4A9C" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#5A3574" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer champion crest -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Crown body: intentionally angular, competitive, not regal-fantasy -->
  <path d="M23 57
           L27 31
           L39 43
           L48 23
           L57 43
           L69 31
           L73 57
           L66 67
           H30
           Z"
        fill="#0A0B0F"
        stroke="url(#silver)"
        stroke-width="2.1"
        stroke-linejoin="round"/>

  <!-- Inner gunmetal plate -->
  <path d="M30 55
           L32 40
           L41 49
           L48 34
           L55 49
           L64 40
           L66 55
           L62 61
           H34
           Z"
        fill="url(#gunmetal)"
        stroke="#34373D"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Violet winner rail -->
  <path d="M33 58H63"
        stroke="url(#violet)"
        stroke-width="1.6"
        stroke-linecap="round"
        opacity="0.82"/>

  <!-- Crown tip accents -->
  <circle cx="27" cy="31" r="2.4"
          fill="#0A0B0F"
          stroke="url(#silver)"
          stroke-width="1.1"/>
  <circle cx="48" cy="23" r="2.7"
          fill="#0A0B0F"
          stroke="url(#silver)"
          stroke-width="1.1"/>
  <circle cx="69" cy="31" r="2.4"
          fill="#0A0B0F"
          stroke="url(#silver)"
          stroke-width="1.1"/>

  <!-- Central champion jewel / Veil energy -->
  <path d="M48 39L42.5 47L48 54L53.5 47Z"
        fill="#08090C"
        stroke="url(#violet)"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <circle cx="48" cy="47" r="4.5"
          fill="url(#jewelCore)"
          filter="url(#coreGlow)"/>

  <circle cx="48" cy="47" r="1.55"
          fill="#F3E8FF"/>

  <!-- Champion base notch -->
  <path d="M36 67L42 72H54L60 67"
        fill="none"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Tiny family gate ticks -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.46">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
