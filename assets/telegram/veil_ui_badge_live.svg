<svg xmlns="http://www.w3.org/2000/svg" width="384" height="96" viewBox="0 0 384 96" fill="none">
  <title>Veil UI Badge Live</title>
  <desc>384x96 transparent responsive status badge frame for the LIVE state. Exact geometry match to the Veil badge family, with 64px protected end caps and a 256px stretch-safe center. No baked-in text.</desc>

  <metadata>
    asset: veil_ui_badge_live.svg
    geometry-family: veil_ui_badge_alive.svg
    canvas: 384x96
    aspect-ratio: 4:1
    transparent-background: true
    protected-end-caps: 64px left / 64px right
    stretch-safe-center: x=64..320
    intended-css-height: 24-32px
    text: live HTML/CSS only
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F0F3"/>
      <stop offset="0.20" stop-color="#858892"/>
      <stop offset="0.50" stop-color="#D3D4D9"/>
      <stop offset="0.78" stop-color="#5B5E68"/>
      <stop offset="1" stop-color="#A8ABB3"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1D23"/>
      <stop offset="0.48" stop-color="#06070A"/>
      <stop offset="1" stop-color="#121319"/>
    </linearGradient>

    <linearGradient id="liveViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C277A"/>
      <stop offset="0.14" stop-color="#8450C0"/>
      <stop offset="0.50" stop-color="#B278F0"/>
      <stop offset="0.86" stop-color="#8450C0"/>
      <stop offset="1" stop-color="#4C277A"/>
    </linearGradient>

    <radialGradient id="liveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BF8AFF" stop-opacity="0.44"/>
      <stop offset="0.52" stop-color="#9256CE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7B3DB9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E3C7FF" stop-opacity="0.98"/>
      <stop offset="0.38" stop-color="#BC83F1" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#69408F" stop-opacity="0.24"/>
    </radialGradient>

    <filter id="softGlow" x="-45%" y="-150%" width="190%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>

    <filter id="railGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreBloom" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="micro" width="24" height="16" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="4" r="0.35" fill="#FFFFFF" opacity="0.032"/>
      <circle cx="17" cy="11" r="0.30" fill="#BE8BEA" opacity="0.04"/>
      <path d="M7 13l5-1" stroke="#FFFFFF" stroke-width="0.28" opacity="0.018"/>
    </pattern>
  </defs>

  <!-- True transparent exterior; LIVE is the strongest badge-state glow -->
  <ellipse cx="52" cy="48" rx="42" ry="32" fill="url(#liveGlow)" opacity="0.52" filter="url(#softGlow)"/>
  <ellipse cx="332" cy="48" rx="42" ry="32" fill="url(#liveGlow)" opacity="0.52" filter="url(#softGlow)"/>

  <!-- EXACT SAME OUTER CREST GEOMETRY AS ALIVE / DEAD / READY / PENDING -->
  <path d="M52 19
           H332
           C343 19 352 25 357 34
           L370 48
           L357 62
           C352 71 343 77 332 77
           H52
           C41 77 32 71 27 62
           L14 48
           L27 34
           C32 25 41 19 52 19Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="3"/>

  <!-- EXACT SAME INNER FACE GEOMETRY -->
  <path d="M58 25
           H326
           C336 25 343 30 347 37
           L356 48
           L347 59
           C343 66 336 71 326 71
           H58
           C48 71 41 66 37 59
           L28 48
           L37 37
           C41 30 48 25 58 25Z"
        fill="#08090D"
        stroke="#24262D"
        stroke-width="2"/>

  <!-- LIVE state rails: brighter than READY but still compact -->
  <path d="M66 29H318"
        stroke="url(#liveViolet)"
        stroke-width="1.8"
        stroke-linecap="round"
        filter="url(#railGlow)"/>
  <path d="M66 67H318"
        stroke="#9D64CC"
        stroke-opacity="0.34"
        stroke-width="1.15"/>

  <!-- Very restrained interior LIVE energy: preserves clean text center -->
  <path d="M80 34H304"
        stroke="#C18BEA"
        stroke-opacity="0.07"
        stroke-width="1"/>
  <path d="M80 62H304"
        stroke="#8E57B8"
        stroke-opacity="0.06"
        stroke-width="1"/>

  <!-- Same subtle micro texture footprint -->
  <path d="M58 28H326C334 28 339 32 343 38L351 48L343 58C339 64 334 68 326 68H58C50 68 45 64 41 58L33 48L41 38C45 32 50 28 58 28Z"
        fill="url(#micro)"
        opacity="0.38"/>

  <!-- Left protected end cap: exact family geometry -->
  <g aria-label="left protected end cap">
    <circle cx="42" cy="48" r="13" fill="#07090B" stroke="url(#silver)" stroke-width="2.2"/>
    <circle cx="42" cy="48" r="7.2" fill="#040506" stroke="#8757AF" stroke-width="1.2"/>
    <circle cx="42" cy="48" r="4.4" fill="url(#coreGlow)" opacity="0.90" filter="url(#coreBloom)"/>
    <circle cx="42" cy="48" r="1.7" fill="#F0DFFF"/>

    <path d="M27 48H17" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
    <path d="M17 48L27 42V54L17 48Z" fill="#111318" stroke="url(#silver)" stroke-width="1.5"/>

    <path d="M50 37L59 31L55 41" fill="#0E1013" stroke="url(#silver)" stroke-width="1.25"/>
    <path d="M50 59L59 65L55 55" fill="#0E1013" stroke="url(#silver)" stroke-width="1.25"/>

    <path d="M50 48H61" stroke="#AF75DD" stroke-opacity="0.62" stroke-width="1.15"/>
    <circle cx="42" cy="48" r="10.3" stroke="#BC83EA" stroke-opacity="0.36" stroke-width="0.9"/>
  </g>

  <!-- Right protected end cap: exact family geometry -->
  <g aria-label="right protected end cap">
    <circle cx="342" cy="48" r="13" fill="#07090B" stroke="url(#silver)" stroke-width="2.2"/>
    <circle cx="342" cy="48" r="7.2" fill="#040506" stroke="#8757AF" stroke-width="1.2"/>
    <circle cx="342" cy="48" r="4.4" fill="url(#coreGlow)" opacity="0.90" filter="url(#coreBloom)"/>
    <circle cx="342" cy="48" r="1.7" fill="#F0DFFF"/>

    <path d="M357 48H367" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
    <path d="M367 48L357 42V54L367 48Z" fill="#111318" stroke="url(#silver)" stroke-width="1.5"/>

    <path d="M334 37L325 31L329 41" fill="#0E1013" stroke="url(#silver)" stroke-width="1.25"/>
    <path d="M334 59L325 65L329 55" fill="#0E1013" stroke="url(#silver)" stroke-width="1.25"/>

    <path d="M334 48H323" stroke="#AF75DD" stroke-opacity="0.62" stroke-width="1.15"/>
    <circle cx="342" cy="48" r="10.3" stroke="#BC83EA" stroke-opacity="0.36" stroke-width="0.9"/>
  </g>

  <!-- Same machining accents -->
  <g stroke="#F0F0F2" stroke-opacity="0.22" stroke-width="0.7">
    <path d="M67 24l5 3"/>
    <path d="M67 72l5-3"/>
    <path d="M317 24l-5 3"/>
    <path d="M317 72l-5-3"/>
  </g>

  <!-- Non-rendering production guides -->
  <g opacity="0" pointer-events="none">
    <rect id="left-cap" x="0" y="0" width="64" height="96"/>
    <rect id="stretch-safe-center" x="64" y="0" width="256" height="96"/>
    <rect id="right-cap" x="320" y="0" width="64" height="96"/>
  </g>
</svg>
