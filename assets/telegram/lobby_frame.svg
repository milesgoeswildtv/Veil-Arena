      fill="url(#gunmetal)" stroke="url(#chromeH)" stroke-width="7"/>
    <path d="M50 73 L65 57 L81 72 L66 91 Z"
      fill="url(#gem)" stroke="#edd9f8" stroke-width="3" filter="url(#smallGlow)"/>
    <path d="M98 46 L109 34 L122 50 L111 64 Z"
