    <path d="M93 192 V832" stroke="url(#violetV)" stroke-width="3.5" fill="none" filter="url(#smallGlow)"/>
    <path d="M126 220 V804" stroke="#7c2db5" stroke-width="2.5" opacity=".45" fill="none"/>
