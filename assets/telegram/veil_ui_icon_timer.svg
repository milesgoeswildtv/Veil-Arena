<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Timer</title>
  <desc>96x96 transparent Veil countdown/timer icon. Angular circular timer housing in silver and gunmetal with a restrained violet countdown arc and a sharp central timer hand. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_timer.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744B9E"/>
      <stop offset="0.55" stop-color="#A86FD0"/>
      <stop offset="1" stop-color="#593576"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0DEFF" stop-opacity="1"/>
      <stop offset="0.36" stop-color="#C88DEB" stop-opacity="0.95"/>
      <stop offset="0.74" stop-color="#7B4A9E" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#593576" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreBloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Veil crest housing -->
  <path d="M48 10
           L60 17
           L73 18
           L78 30
           L86 39
           L81 51
           L79 66
           L65 70
           L48 86
           L31 70
           L17 66
           L15 51
           L10 39
           L18 30
           L23 18
           L36 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Timer crown / top lug -->
  <path d="M42 18H54L56 24H40Z"
        fill="#101218"
        stroke="url(#silver)"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- Main timer body -->
  <circle cx="48" cy="48" r="24.5"
          fill="#090A0D"
          stroke="url(#silver)"
          stroke-width="2.1"/>

  <circle cx="48" cy="48" r="19.5"
          fill="url(#gunmetal)"
          stroke="#363941"
          stroke-width="1.2"/>

  <!-- Countdown arc: active time running down -->
  <path d="M30 36
           A20 20 0 0 1 62 31"
        fill="none"
        stroke="url(#violet)"
        stroke-width="2.6"
        stroke-linecap="round"/>

  <path d="M66 35
           A20 20 0 0 1 66 60"
        fill="none"
        stroke="url(#violet)"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity="0.55"/>

  <!-- Tick marks -->
  <g stroke="#A8ABB2" stroke-width="1.25" stroke-linecap="round" opacity="0.92">
    <path d="M48 27V31"/>
    <path d="M48 65V69"/>
    <path d="M27 48H31"/>
    <path d="M65 48H69"/>
  </g>

  <g stroke="#7E8188" stroke-width="1.05" stroke-linecap="round" opacity="0.75">
    <path d="M33.6 33.6L36.4 36.4"/>
    <path d="M62.4 33.6L59.6 36.4"/>
    <path d="M33.6 62.4L36.4 59.6"/>
    <path d="M62.4 62.4L59.6 59.6"/>
  </g>

  <!-- Sharp timer hand / marker -->
  <path d="M48 48L58 38"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <path d="M48 48L45 58"
        stroke="#6D7380"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- Central core -->
  <circle cx="48" cy="48" r="5.2"
          fill="url(#coreGlow)"
          filter="url(#coreBloom)"/>
  <circle cx="48" cy="48" r="1.7" fill="#F4E9FF"/>

  <!-- Subtle lower timing notch -->
  <path d="M40 69H56"
        stroke="url(#silver)"
        stroke-width="1.4"
        stroke-linecap="round"
        opacity="0.95"/>

  <!-- Small side fins for angular housing feel -->
  <path d="M21 39L15 44L22 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <path d="M75 39L81 44L74 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Tiny family gate ticks -->
  <g stroke="#B181D3" stroke-width="1.1" stroke-linecap="round" opacity="0.44">
    <path d="M48 15V18"/>
    <path d="M48 75V78"/>
    <path d="M18 48H21"/>
    <path d="M75 48H78"/>
  </g>
</svg>
