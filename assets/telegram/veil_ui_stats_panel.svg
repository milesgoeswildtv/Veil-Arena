    <path d="M399 336H561L575 349V355L561 368H399L387 358V346Z" fill="#04060A" stroke="#20242B" stroke-width="1.0" stroke-linejoin="round" opacity="0.76"/>
    <path d="M604 336H766L780 349V355L766 368H604L592 358V346Z" fill="#04060A" stroke="#20242B" stroke-width="1.0" stroke-linejoin="round" opacity="0.76"/>
  </g>

  <!-- metric signal nodes, no numbers or fake values -->
  <g>
    <circle cx="208" cy="273" r="4.2" fill="url(#violetCore)" opacity="0.64"/>
    <circle cx="413" cy="273" r="4.2" fill="url(#violetCore)" opacity="0.64"/>
    <circle cx="618" cy="273" r="4.2" fill="url(#violetCore)" opacity="0.64"/>
