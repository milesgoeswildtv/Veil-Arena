  <path d="M170 104H790" stroke="url(#violetRail)" stroke-opacity="0.09" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M152 566H808" stroke="url(#silverRail)" stroke-width="1.9" stroke-linecap="round" opacity="0.86" filter="url(#edgeGlow)"/>
