  <path d="M178 536H782L806 556V566L782 580H178L162 568V546Z" fill="#05070B"/>
  <path d="M178 536H782L806 556V566L782 580H178L162 568V546Z" fill="url(#microNoise)" opacity="0.14"/>
  <path d="M204 550H372" stroke="#F2F5FA" stroke-opacity="0.05" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M396 550H564" stroke="url(#violetRail)" stroke-opacity="0.10" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M588 550H756" stroke="#F2F5FA" stroke-opacity="0.05" stroke-width="1.1" stroke-linecap="round"/>

  <!-- analytical top-center monitoring core -->
  <path d="M480 34V114" stroke="url(#violetRail)" stroke-width="2.0" stroke-linecap="round" opacity="0.82" filter="url(#edgeGlow)"/>
  <path d="M454 54H506" stroke="url(#silverRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.74"/>
  <circle cx="480" cy="88" r="12.5" fill="url(#violetCore)" opacity="0.88" filter="url(#softGlow)"/>
  <circle cx="480" cy="88" r="8.2" fill="url(#softSilverCore)" opacity="0.72" filter="url(#softGlow)"/>
  <circle cx="480" cy="88" r="4.4" fill="#FFFFFF" fill-opacity="0.88"/>
  <path d="M464 70H472M488 70H496" stroke="url(#telemetryRail)" stroke-width="1.1" stroke-linecap="round" opacity="0.44"/>
  <path d="M468 76H492" stroke="url(#violetRail)" stroke-width="0.9" stroke-linecap="round" opacity="0.26"/>

