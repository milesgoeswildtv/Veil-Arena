<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" preserveAspectRatio="none" fill="none">
  <title>Veil UI Stats Panel</title>
  <desc>Reusable Veil performance and arena telemetry shell. True SVG vector, 960 by 640, transparent exterior, no baked-in text, images, or raster data. Provides live summary, metric-cell, telemetry, and lower detail regions for HTML/CSS-driven statistics.</desc>

  <metadata>
    asset: veil_ui_stats_panel.svg
    family: veil_ui_vote_panel.svg / veil_ui_results_panel.svg / veil_ui_sponsor_panel.svg / veil_ui_rules_panel.svg
    canvas: 960x640
    viewBox: 0 0 960 640
    aspect-ratio: 3:2
    transparent-background: true
    text: none
    image: none
    foreignObject: none
    raster: none
    protected-outer-zones: 96px
    content-zones: header, primary-metrics, telemetry, detail-strip
    responsive: mobile + desktop
  </metadata>

  <defs>
    <linearGradient id="silverEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7FA"/>
      <stop offset="0.16" stop-color="#979DA7"/>
      <stop offset="0.50" stop-color="#D7DCE4"/>
      <stop offset="0.82" stop-color="#585E68"/>
      <stop offset="1" stop-color="#C0C6D0"/>
    </linearGradient>

    <linearGradient id="gunmetalOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1D24"/>
      <stop offset="0.44" stop-color="#090B10"/>
      <stop offset="1" stop-color="#14171D"/>
    </linearGradient>

    <linearGradient id="gunmetalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0F14"/>
      <stop offset="0.54" stop-color="#07090D"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>

    <linearGradient id="violetRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#372153"/>
      <stop offset="0.18" stop-color="#63448D"/>
      <stop offset="0.50" stop-color="#AD7CDF"/>
      <stop offset="0.82" stop-color="#63448D"/>
      <stop offset="1" stop-color="#372153"/>
    </linearGradient>

    <linearGradient id="silverRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#687180"/>
      <stop offset="0.16" stop-color="#ADB6C4"/>
      <stop offset="0.50" stop-color="#F5F7FB"/>
      <stop offset="0.84" stop-color="#ADB6C4"/>
      <stop offset="1" stop-color="#687180"/>
    </linearGradient>

    <linearGradient id="telemetryRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56606F"/>
      <stop offset="0.22" stop-color="#A9B3C1"/>
      <stop offset="0.50" stop-color="#DDE3EC"/>
      <stop offset="0.78" stop-color="#8361A4"/>
      <stop offset="1" stop-color="#46335C"/>
    </linearGradient>

    <radialGradient id="violetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="0.20" stop-color="#F0E5FB" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="#C995EE" stop-opacity="0.56"/>
      <stop offset="0.76" stop-color="#79519E" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#79519E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softSilverCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="0.46" stop-color="#EDF2F9" stop-opacity="0.38"/>
      <stop offset="0.86" stop-color="#AAB4C1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#AAB4C1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="microNoise" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="0.4" fill="#FFFFFF" opacity="0.018"/>
      <circle cx="16" cy="14" r="0.35" fill="#C997F0" opacity="0.010"/>
      <path d="M8 18l4-1" stroke="#FFFFFF" stroke-width="0.28" opacity="0.009"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.7"/>
    </filter>

    <filter id="edgeGlow" x="-20%" y="-140%" width="140%" height="380%">
      <feGaussianBlur stdDeviation="1.55" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- transparent exterior -->

  <!-- quiet ambient system glows -->
  <ellipse cx="110" cy="104" rx="38" ry="38" fill="url(#violetCore)" opacity="0.10" filter="url(#softGlow)"/>
  <ellipse cx="850" cy="104" rx="38" ry="38" fill="url(#violetCore)" opacity="0.10" filter="url(#softGlow)"/>
  <ellipse cx="110" cy="536" rx="38" ry="38" fill="url(#violetCore)" opacity="0.07" filter="url(#softGlow)"/>
  <ellipse cx="850" cy="536" rx="38" ry="38" fill="url(#violetCore)" opacity="0.07" filter="url(#softGlow)"/>

