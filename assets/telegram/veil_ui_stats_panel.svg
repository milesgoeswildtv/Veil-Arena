    <path d="M425 273H457" stroke="url(#telemetryRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.30"/>
    <path d="M630 273H662" stroke="url(#telemetryRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.30"/>
  </g>

