  <path d="M548 424H764L778 437V459L764 472H548L536 462V434Z" fill="#04060A" stroke="#222730" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M560 438H750" stroke="url(#silverRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.12"/>
  <path d="M560 452H750" stroke="url(#telemetryRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.12"/>
  <path d="M560 466H750" stroke="url(#silverRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.10"/>
  <circle cx="552" cy="438" r="3.5" fill="url(#violetCore)" opacity="0.46"/>
  <circle cx="552" cy="452" r="3.5" fill="url(#softSilverCore)" opacity="0.46"/>
  <circle cx="552" cy="466" r="3.5" fill="url(#violetCore)" opacity="0.34"/>

