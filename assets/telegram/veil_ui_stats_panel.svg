  <g>
    <path d="M194 258H356L370 271V317L356 330H194L182 320V268Z" fill="#05070B" stroke="#252A33" stroke-width="1.15" stroke-linejoin="round"/>
    <path d="M399 258H561L575 271V317L561 330H399L387 320V268Z" fill="#05070B" stroke="#252A33" stroke-width="1.15" stroke-linejoin="round"/>
