<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Skull</title>
  <desc>96x96 transparent Veil death/elimination icon. Angular mechanical-gothic skull in silver/gunmetal with restrained violet energy accents. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_skull.svg
    family: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7650A1"/>
      <stop offset="0.55" stop-color="#A570CF"/>
      <stop offset="1" stop-color="#5A377A"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E2CBF6" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#A871D0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#6B3F8F" stop-opacity="0"/>
    </radialGradient>

    <filter id="violetGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mechanical-gothic skull silhouette -->
  <path d="M48 11
           C63 11 76 20 80 35
           C82 45 79 55 73 62
           L67 68
           L64 79
           L55 84
           L48 80
           L41 84
           L32 79
           L29 68
           L23 62
           C17 55 14 45 16 35
           C20 20 33 11 48 11Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.3"
        stroke-linejoin="round"/>

  <!-- Angular brow/temple plating -->
  <path d="M25 34L35 22L48 19L61 22L71 34L64 31L58 28L48 27L38 28L32 31Z"
        fill="#111318"
        stroke="#3A3D44"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Hollow eyes -->
  <path d="M28 42L36 35L43 38L42 50L34 54L27 50Z"
        fill="#030406"
        stroke="#6B7078"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <path d="M68 42L60 35L53 38L54 50L62 54L69 50Z"
        fill="#030406"
        stroke="#6B7078"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- Violet eye cavity accents, intentionally subtle -->
  <path d="M31 44L36 39L40 41"
        stroke="url(#violet)"
        stroke-width="1.1"
        stroke-linecap="round"
        opacity="0.58"/>

  <path d="M65 44L60 39L56 41"
        stroke="url(#violet)"
        stroke-width="1.1"
        stroke-linecap="round"
        opacity="0.58"/>

  <!-- Nasal cutout -->
  <path d="M48 49L43 59H53Z"
        fill="#030406"
        stroke="#5A5D64"
        stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Cheek plates -->
  <path d="M24 55L34 58L39 67L33 69L27 64Z"
        fill="#0D0F13"
        stroke="#72757E"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <path d="M72 55L62 58L57 67L63 69L69 64Z"
        fill="#0D0F13"
        stroke="#72757E"
        stroke-width="1.1"
        stroke-linejoin="round"/>

  <!-- Jaw block -->
  <path d="M34 66L40 62H56L62 66L60 76L53 80H43L36 76Z"
        fill="#0A0B0E"
        stroke="url(#silver)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Simplified teeth / jaw segmentation -->
  <g stroke="#80838B" stroke-width="1">
    <path d="M41 68V76"/>
    <path d="M46 67V77"/>
    <path d="M50 67V77"/>
    <path d="M55 68V76"/>
  </g>

  <!-- Forehead Veil energy mark -->
  <path d="M48 24L43 31L48 35L53 31Z"
        fill="#090A0D"
        stroke="url(#violet)"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <circle cx="48" cy="30" r="3.4"
          fill="url(#coreGlow)"
          filter="url(#violetGlow)"/>
  <circle cx="48" cy="30" r="1.3"
          fill="#E7D6F5"/>

  <!-- Jaw seam energy cue -->
  <path d="M42 71H54"
        stroke="#A570CF"
        stroke-width="1.1"
        stroke-linecap="round"
        opacity="0.52"/>

  <!-- Small gothic temple spikes, contained within safe padding -->
  <path d="M20 38L12 44L21 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <path d="M76 38L84 44L75 46"
        fill="#0E1014"
        stroke="url(#silver)"
        stroke-width="1.2"
        stroke-linejoin="round"/>
</svg>
