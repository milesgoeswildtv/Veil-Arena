<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none">
  <title>Veil UI Player State Dead</title>
  <desc>720x360 transparent overlay for the Veil UI player card. Adds restrained DEAD state treatment only: deep crimson rails, dimmed corner/core activity, and a darker fractured portrait edge response. No base card body or text is duplicated.</desc>

  <metadata>
    asset: veil_ui_player_state_dead.svg
    family: veil_ui_player_card.svg
    canvas: 720x360
    aspect-ratio: 2:1
    transparent-background: true
    overlay-only: true
    alignment: exact match to veil_ui_player_card.svg
    text: none
    intended-use: dead state overlay
  </metadata>

  <defs>
    <linearGradient id="crimsonRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#461318"/>
      <stop offset="0.18" stop-color="#7D202A"/>
      <stop offset="0.50" stop-color="#B53A45"/>
      <stop offset="0.82" stop-color="#7D202A"/>
      <stop offset="1" stop-color="#461318"/>
    </linearGradient>

    <linearGradient id="crimsonSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9DB" stop-opacity="0.62"/>
      <stop offset="0.25" stop-color="#C55A63" stop-opacity="0.42"/>
      <stop offset="0.70" stop-color="#6E1D26" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2C0E12" stop-opacity="0.02"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF1F2" stop-opacity="0.58"/>
      <stop offset="0.30" stop-color="#D8737A" stop-opacity="0.42"/>
      <stop offset="0.70" stop-color="#6D1F27" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6D1F27" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>

    <filter id="edgeGlow" x="-20%" y="-140%" width="140%" height="380%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="portraitGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- top/bottom DEAD state rails -->
  <path d="M108 68H612" stroke="url(#crimsonRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.82" filter="url(#edgeGlow)"/>
  <path d="M124 80H596" stroke="#D07B83" stroke-opacity="0.09" stroke-width="1.0" stroke-linecap="round"/>

  <path d="M108 292H612" stroke="url(#crimsonRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.82" filter="url(#edgeGlow)"/>
  <path d="M124 280H596" stroke="#D07B83" stroke-opacity="0.09" stroke-width="1.0" stroke-linecap="round"/>

  <!-- subtle side response, less energized than ALIVE -->
  <path d="M76 114V246" stroke="url(#crimsonRail)" stroke-width="1.7" stroke-linecap="round" opacity="0.74" filter="url(#edgeGlow)"/>
  <path d="M644 114V246" stroke="url(#crimsonRail)" stroke-width="1.3" stroke-linecap="round" opacity="0.42" filter="url(#edgeGlow)"/>

  <!-- portrait edge response, darker and fractured -->
  <path d="M52 74H190L220 104V256L190 286H52L34 268V92Z"
        fill="none"
        stroke="url(#crimsonSoft)"
        stroke-width="2.1"
        stroke-linejoin="round"
        filter="url(#portraitGlow)"/>

  <path d="M60 82H184L210 108V252L184 278H60L42 262V98Z"
        fill="none"
        stroke="#D27A82"
        stroke-opacity="0.12"
        stroke-width="1.0"
        stroke-linejoin="round"
        stroke-dasharray="12 7 4 7"/>

  <!-- fractured portrait accents -->
  <path d="M78 100L92 116L86 128L103 141" fill="none" stroke="url(#crimsonRail)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.42"/>
  <path d="M168 244L154 228L160 214L144 200" fill="none" stroke="url(#crimsonRail)" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" opacity="0.36"/>
  <path d="M80 258C98 266 126 265 149 257" fill="none" stroke="url(#crimsonRail)" stroke-width="1.0" stroke-linecap="round" opacity="0.28"/>

  <!-- center crest activity, dimmed / powered down -->
  <path d="M360 22V90" stroke="url(#crimsonRail)" stroke-width="2.2" stroke-linecap="round" opacity="0.54" filter="url(#edgeGlow)"/>
  <circle cx="360" cy="70" r="9.2" fill="url(#coreGlow)" opacity="0.72" filter="url(#softGlow)"/>
  <circle cx="360" cy="70" r="3.2" fill="#FFE0E2" fill-opacity="0.44"/>

  <path d="M360 270V338" stroke="url(#crimsonRail)" stroke-width="1.9" stroke-linecap="round" opacity="0.46" filter="url(#edgeGlow)"/>
  <circle cx="360" cy="290" r="8.4" fill="url(#coreGlow)" opacity="0.58" filter="url(#softGlow)"/>
  <circle cx="360" cy="290" r="2.9" fill="#FFE0E2" fill-opacity="0.36"/>

  <!-- corner/core activity, dimmer than ALIVE -->
  <g>
    <circle cx="78" cy="78" r="22" fill="url(#coreGlow)" opacity="0.20" filter="url(#softGlow)"/>
    <circle cx="78" cy="78" r="5.2" fill="#FFE6E8" fill-opacity="0.42"/>
    <path d="M61 78A17 17 0 0 1 78 61" fill="none" stroke="url(#crimsonRail)" stroke-width="1.4" stroke-linecap="round" opacity="0.46"/>
  </g>
  <g>
    <circle cx="642" cy="78" r="22" fill="url(#coreGlow)" opacity="0.17" filter="url(#softGlow)"/>
    <circle cx="642" cy="78" r="4.9" fill="#FFE6E8" fill-opacity="0.38"/>
    <path d="M659 78A17 17 0 0 0 642 61" fill="none" stroke="url(#crimsonRail)" stroke-width="1.3" stroke-linecap="round" opacity="0.38"/>
  </g>
  <g>
    <circle cx="78" cy="282" r="22" fill="url(#coreGlow)" opacity="0.13" filter="url(#softGlow)"/>
    <circle cx="78" cy="282" r="4.4" fill="#FFE6E8" fill-opacity="0.30"/>
    <path d="M61 282A17 17 0 0 0 78 299" fill="none" stroke="url(#crimsonRail)" stroke-width="1.2" stroke-linecap="round" opacity="0.30"/>
  </g>
  <g>
    <circle cx="642" cy="282" r="22" fill="url(#coreGlow)" opacity="0.12" filter="url(#softGlow)"/>
    <circle cx="642" cy="282" r="4.2" fill="#FFE6E8" fill-opacity="0.28"/>
    <path d="M659 282A17 17 0 0 1 642 299" fill="none" stroke="url(#crimsonRail)" stroke-width="1.2" stroke-linecap="round" opacity="0.28"/>
  </g>

  <!-- lower strip residual line, faint and suppressed -->
  <path d="M259 257H642" stroke="url(#crimsonRail)" stroke-width="1.05" stroke-linecap="round" opacity="0.12"/>
  <path d="M272 278H632" stroke="#FFD5D8" stroke-opacity="0.045" stroke-width="1.0" stroke-linecap="round"/>
</svg>
