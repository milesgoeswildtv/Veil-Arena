<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none">
  <title>Veil UI Panel Frame</title>
  <desc>960x640 transparent responsive Veil panel frame for lobbies, player cards, voting panels, results, sponsor panels, rules, stats, modals, and content containers. Designed for 9-slice scaling with 96px protected corners and edge zones, and a large stretch-safe interior.</desc>

  <metadata>
    asset: veil_ui_panel_frame.svg
    canvas: 960x640
    aspect-ratio: 3:2
    transparent-background: true
    protected-corners-edges: 96px
    stretch-safe-center: x=96..864, y=96..544
    scalable: 9-slice friendly
    text: live HTML/CSS only
    intended-use: lobbies, cards, voting panels, results, sponsor panels, rules, stats, modals, content containers
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.18" stop-color="#969AA3"/>
      <stop offset="0.52" stop-color="#D4D7DD"/>
      <stop offset="0.78" stop-color="#5A5E68"/>
      <stop offset="1" stop-color="#B1B5BE"/>
    </linearGradient>

    <linearGradient id="silverDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5C9D1"/>
      <stop offset="1" stop-color="#454A55"/>
    </linearGradient>

    <linearGradient id="gunmetalOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1F25"/>
      <stop offset="0.45" stop-color="#090A0E"/>
      <stop offset="1" stop-color="#15171D"/>
    </linearGradient>

    <linearGradient id="gunmetalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0D11"/>
      <stop offset="0.55" stop-color="#07080B"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>

    <linearGradient id="panelWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.52" stop-color="#05070A"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>

    <linearGradient id="violetRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E265C"/>
      <stop offset="0.20" stop-color="#7750A4"/>
      <stop offset="0.50" stop-color="#A771D3"/>
      <stop offset="0.80" stop-color="#7750A4"/>
      <stop offset="1" stop-color="#3E265C"/>
    </linearGradient>

    <radialGradient id="violetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2E3FF" stop-opacity="1"/>
      <stop offset="0.36" stop-color="#CA94EE" stop-opacity="0.92"/>
      <stop offset="0.70" stop-color="#7C4DA2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5A3676" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BA84E5" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#8A57B6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8A57B6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="edgeGlow" x="-20%" y="-120%" width="140%" height="340%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="microTexture" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="0.55" fill="#FFFFFF" opacity="0.025"/>
      <circle cx="17" cy="14" r="0.45" fill="#C38CEA" opacity="0.020"/>
      <path d="M8 19l4-1" stroke="#FFFFFF" stroke-width="0.35" opacity="0.015"/>
    </pattern>
  </defs>

  <!-- transparent exterior -->

  <!-- corner ambient glows -->
  <ellipse cx="118" cy="114" rx="54" ry="54" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <ellipse cx="842" cy="114" rx="54" ry="54" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <ellipse cx="118" cy="526" rx="54" ry="54" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <ellipse cx="842" cy="526" rx="54" ry="54" fill="url(#cornerGlow)" filter="url(#softGlow)"/>

  <!-- OUTER FRAME : protected geometry lives in outer 96px zones -->
  <path d="M98 58
           H406
           L426 38
           H534
           L554 58
           H862
           L902 96
           V248
           L922 268
           V372
           L902 392
           V544
           L862 582
           H554
           L534 602
           H426
           L406 582
           H98
           L58 544
           V392
           L38 372
           V268
           L58 248
           V96
           Z"
        fill="url(#gunmetalOuter)"
        stroke="url(#silver)"
        stroke-width="4"
        stroke-linejoin="round"/>

