  <g aria-label="bottom-right corner module">
    <circle cx="848" cy="528" r="31" fill="#07080C" stroke="url(#silver)" stroke-width="3"/>
    <circle cx="848" cy="528" r="18" fill="#06070A" stroke="#695087" stroke-width="1.8"/>
    <circle cx="848" cy="528" r="7" fill="url(#violetCore)"/>
    <path d="M877 559L911 577L897 543Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M819 559L785 577L799 543Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M877 497L895 463L861 477Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M884 528A36 36 0 0 1 848 564" fill="none" stroke="url(#violetRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.72"/>
  </g>

  <!-- mid-side anchors -->
  <g aria-label="left side anchor">
    <path d="M34 320L58 308V332Z" fill="#0F1116" stroke="url(#silver)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="58" cy="320" r="14" fill="#090A0E" stroke="url(#silver)" stroke-width="1.6"/>
    <circle cx="58" cy="320" r="5" fill="url(#violetCore)"/>
  </g>
  <g aria-label="right side anchor">
