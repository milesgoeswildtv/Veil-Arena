    <circle cx="112" cy="528" r="18" fill="#06070A" stroke="#695087" stroke-width="1.8"/>
    <circle cx="112" cy="528" r="7" fill="url(#violetCore)"/>
    <path d="M83 559L49 577L63 543Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M141 559L175 577L161 543Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M81 497L63 463L97 477Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M76 528A36 36 0 0 0 112 564" fill="none" stroke="url(#violetRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.72"/>
