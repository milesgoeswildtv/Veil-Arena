        fill="#0A0B10"
        stroke="url(#silverDark)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Main panel body -->
  <path d="M122 84
           H419
           L435 69
           H525
           L541 84
           H838
           L876 120
           V256
           L892 272
           V368
           L876 384
           V520
           L838 556
           H541
           L525 571
           H435
           L419 556
           H122
           L84 520
           V384
           L68 368
           V272
           L84 256
           V120
           Z"
        fill="url(#panelWash)"
        stroke="#262930"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Recessed content basin -->
  <path d="M144 107
           H428
           L442 94
           H518
           L532 107
           H816
           L850 139
           V262
           L863 275
           V365
           L850 378
           V501
           L816 533
           H532
           L518 546
           H442
           L428 533
           H144
           L110 501
           V378
           L97 365
           V275
           L110 262
           V139
