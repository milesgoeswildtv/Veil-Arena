  <path d="M109 71
           H411
           L429 54
           H531
           L549 71
           H851
           L889 107
           V252
           L907 270
           V370
           L889 388
           V533
           L851 569
           H549
           L531 586
           H429
           L411 569
           H109
           L71 533
           V388
           L53 370
           V270
           L71 252
           V107
