        fill="url(#gunmetalInner)"
        stroke="#171A20"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- large clean stretch-safe content area (visual only) -->
  <rect x="174" y="137" width="612" height="366" rx="18"
        fill="#040509" opacity="0.74"/>
  <rect x="174" y="137" width="612" height="366" rx="18"
        fill="url(#microTexture)" opacity="0.40"/>

  <!-- top & bottom edge rails -->
  <path d="M161 103H799" stroke="url(#violetRail)" stroke-width="2.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M161 537H799" stroke="url(#violetRail)" stroke-width="2.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M176 118H784" stroke="#B680DB" stroke-opacity="0.16" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M176 522H784" stroke="#B680DB" stroke-opacity="0.16" stroke-width="1.0" stroke-linecap="round"/>

  <!-- side rails -->
  <path d="M104 155V485" stroke="url(#violetRail)" stroke-width="2.0" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M856 155V485" stroke="url(#violetRail)" stroke-width="2.0" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <path d="M118 172V468" stroke="#B680DB" stroke-opacity="0.14" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M842 172V468" stroke="#B680DB" stroke-opacity="0.14" stroke-width="1.0" stroke-linecap="round"/>

  <!-- top center crest -->
  <path d="M453 58H507" stroke="url(#silver)" stroke-width="1.5" stroke-linecap="round" opacity="0.90"/>
  <path d="M480 52V116" stroke="url(#violetRail)" stroke-width="2.8" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <circle cx="480" cy="91" r="10" fill="#0A0B0F" stroke="url(#silver)" stroke-width="1.4"/>
  <circle cx="480" cy="91" r="5.2" fill="url(#violetCore)"/>

  <!-- bottom center crest -->
  <path d="M453 582H507" stroke="url(#silver)" stroke-width="1.5" stroke-linecap="round" opacity="0.90"/>
  <path d="M480 524V588" stroke="url(#violetRail)" stroke-width="2.8" stroke-linecap="round" filter="url(#edgeGlow)"/>
  <circle cx="480" cy="549" r="10" fill="#0A0B0F" stroke="url(#silver)" stroke-width="1.4"/>
  <circle cx="480" cy="549" r="5.2" fill="url(#violetCore)"/>

  <!-- LEFT CORNER MACHINERY -->
  <g aria-label="top-left corner module">
    <circle cx="112" cy="112" r="31" fill="#07080C" stroke="url(#silver)" stroke-width="3"/>
    <circle cx="112" cy="112" r="18" fill="#06070A" stroke="#695087" stroke-width="1.8"/>
    <circle cx="112" cy="112" r="7" fill="url(#violetCore)"/>
    <path d="M83 81L49 63L63 97Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M81 143L63 177L97 163Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M141 81L175 63L161 97Z" fill="#0F1116" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M76 112A36 36 0 0 1 112 76" fill="none" stroke="url(#violetRail)" stroke-width="2.1" stroke-linecap="round" opacity="0.72"/>
