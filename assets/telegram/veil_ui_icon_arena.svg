<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Veil UI Icon Arena</title>
  <desc>96x96 transparent Veil Arena icon. Crossed-blade crest in silver/gunmetal with restrained violet energy accents. Designed for 18–32 CSS px rendering.</desc>

  <metadata>
    asset: veil_ui_icon_arena.svg
    canvas: 96x96
    aspect-ratio: 1:1
    transparent-background: true
    intended-css-size: 18-32px
    safe-padding: 10px
    text: none
  </metadata>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F1F3"/>
      <stop offset="0.22" stop-color="#83868E"/>
      <stop offset="0.50" stop-color="#D6D8DD"/>
      <stop offset="0.78" stop-color="#565962"/>
      <stop offset="1" stop-color="#A5A8B0"/>
    </linearGradient>

    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202228"/>
      <stop offset="0.50" stop-color="#090A0D"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A50A8"/>
      <stop offset="0.55" stop-color="#A873D3"/>
      <stop offset="1" stop-color="#5E387E"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#DCC2F6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#A970D0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#6C3C91" stop-opacity="0"/>
    </radialGradient>

    <filter id="violetGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer crest: compact enough to stay readable at 18px -->
  <path d="M48 10
           L61 17
           L74 18
           L78 31
           L86 42
           L80 54
           L78 69
           L63 72
           L48 86
           L33 72
           L18 69
           L16 54
           L10 42
           L18 31
           L22 18
           L35 17
           Z"
        fill="url(#gunmetal)"
        stroke="url(#silver)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Inner arena ring -->
  <circle cx="48" cy="46" r="22.5"
          fill="#08090C"
          stroke="#2C2F35"
          stroke-width="1.8"/>

  <circle cx="48" cy="46" r="18.5"
          fill="none"
          stroke="url(#violet)"
          stroke-opacity="0.55"
          stroke-width="1.4"/>

  <!-- Crossed blade A -->
  <g transform="rotate(45 48 46)">
    <path d="M46 16
             H50
             L51.5 48
             L48 58
             L44.5 48
             Z"
          fill="url(#silver)"
          stroke="#2B2D33"
          stroke-width="1.1"
          stroke-linejoin="round"/>
    <path d="M42 48H54L52 53H44Z"
          fill="url(#gunmetal)"
          stroke="url(#silver)"
          stroke-width="1"/>
    <rect x="46.4" y="53" width="3.2" height="12" rx="1.4"
          fill="url(#gunmetal)"
          stroke="url(#silver)"
          stroke-width="0.9"/>
    <path d="M43.5 65H52.5L48 71Z"
          fill="url(#silver)"
          stroke="#2B2D33"
          stroke-width="0.8"/>
  </g>

  <!-- Crossed blade B -->
  <g transform="rotate(-45 48 46)">
    <path d="M46 16
             H50
             L51.5 48
             L48 58
             L44.5 48
             Z"
          fill="url(#silver)"
          stroke="#2B2D33"
          stroke-width="1.1"
          stroke-linejoin="round"/>
    <path d="M42 48H54L52 53H44Z"
          fill="url(#gunmetal)"
          stroke="url(#silver)"
          stroke-width="1"/>
    <rect x="46.4" y="53" width="3.2" height="12" rx="1.4"
          fill="url(#gunmetal)"
          stroke="url(#silver)"
          stroke-width="0.9"/>
    <path d="M43.5 65H52.5L48 71Z"
          fill="url(#silver)"
          stroke="#2B2D33"
          stroke-width="0.8"/>
  </g>

  <!-- Central arena core -->
  <circle cx="48" cy="46" r="8.2"
          fill="#090A0D"
          stroke="url(#silver)"
          stroke-width="1.5"/>

  <circle cx="48" cy="46" r="4.3"
          fill="url(#coreGlow)"
          filter="url(#violetGlow)"/>

  <circle cx="48" cy="46" r="1.7"
          fill="#E7D5F7"/>

  <!-- Four small arena gate ticks -->
  <g stroke="#B181D3" stroke-width="1.2" stroke-linecap="round" opacity="0.65">
    <path d="M48 21V25"/>
    <path d="M48 67V71"/>
    <path d="M23 46H27"/>
    <path d="M69 46H73"/>
  </g>
</svg>
