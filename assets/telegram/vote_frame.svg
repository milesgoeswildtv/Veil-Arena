    <path d="M46 71 L63 50 L83 70 L64 94 Z"
      fill="url(#violetGem)" stroke="#efe0f7" stroke-width="3" filter="url(#glow)"/>
    <path d="M99 42 L115 28 L132 48 L116 64 Z"
      fill="url(#whiteGem)" stroke="#d59bf1" stroke-width="2.5"/>
    <path d="M101 96 L158 83 L128 114 Z"
      fill="#351248" stroke="#a94de3" stroke-width="3"/>
    <path d="M119 114 L170 113 L135 136 Z"
      fill="#1a1026" stroke="#7650be" stroke-width="3"/>
    <path d="M21 127 L53 111 L72 135 L50 163 L18 151 Z"
