    <path d="M52 192 V832" stroke="url(#chromeV)" stroke-width="12" fill="none"/>
    <path d="M76 192 V832" stroke="#4f2366" stroke-width="7" fill="none"/>
    <path d="M90 192 V832" stroke="url(#electricV)" stroke-width="4.5" fill="none" filter="url(#glow)"/>
    <path d="M122 266 V470" stroke="#7e38c5" stroke-width="2.5" opacity=".42" fill="none"/>
