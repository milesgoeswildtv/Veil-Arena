name: Arena Smoke Test

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check production module syntax
        run: |
          node --check src/activity-bootstrap-fix-entry.js
          node --check src/activity-doctor-entry.js
          node --check src/activity-entrypoint-entry.js
          node --check src/activity-reset-entry.js
          node --check src/activity-live-entry.js
          node --check src/activity-live.js
          node --check src/activity-live-client.js
          node --check src/discord-recovery-entry.js
          node --check src/test-entry.js
          node --check src/test-mode.js
          node --check src/test-panel-client.js
          node --check src/activity-entry.js
          node --check src/activity-preview.js
          node --check src/activity-preview-client.js
          node --check src/sponsor-panel-client.js
          node --check src/sponsorships.js
          node --check src/entry.js
          node --check src/hub.js
          node --check src/index.js
          node --check src/coordinator.js
          node --check src/core/engine.js
          node --check src/core/simulation.js
          node --check src/storage.js
          node --check src/logs.js
          node --check src/themes/index.js
          node --check src/themes/brawls.js
          node --check src/themes/dwallet.js
          node --check src/themes/dwallet-hq.js
          node --check src/telegram.js
          node --check src/miniapp.js
          node --check src/cooldown.js
          node --check src/rules.js

      - name: Run Arena smoke tests
        run: npm test

      - name: Validate production Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Validate Telegram QA Worker bundle
        run: npx wrangler deploy --dry-run --env test
