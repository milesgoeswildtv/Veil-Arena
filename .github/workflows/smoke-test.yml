name: Arena Core Test

on:
  push:
    branches:
      - main
      - "rebuild/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check core module syntax
        run: |
          node --check src/worker.js
          node --check src/core/engine.js
          node --check src/core/simulation.js
          node --check src/core/orchestrator.js
          node --check src/rules.js
          node --check src/sponsorships.js
          node --check src/storage.js
          node --check src/logs.js
          node --check src/cooldown.js
          node --check src/themes/index.js
          node --check src/themes/brawls.js

      - name: Run Arena core tests
        run: npm test

      - name: Validate clean Cloudflare baseline
        run: npx wrangler deploy --dry-run
