name: Arena Smoke Test

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check production module syntax
        run: |
          node --check src/entry.js
          node --check src/hub.js
          node --check src/index.js
          node --check src/coordinator.js
          node --check src/core/engine.js
          node --check src/storage.js
          node --check src/logs.js
          node --check src/themes/index.js
          node --check src/themes/brawls.js
          node --check src/themes/dwallet.js
          node --check src/themes/dwallet-hq.js
          node --check src/telegram.js
          node --check src/miniapp.js
          node --check src/cooldown.js
          node --check src/rules.js

      - name: Run Arena smoke tests
        run: npm test
